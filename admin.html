<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Control - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: {
                navy: { DEFAULT: '#0A1628', light: '#152238', dark: '#060D1A' },
                gold: { DEFAULT: '#D4A84B', light: '#E8C77B', dark: '#B8860B' }
            },
            fontFamily: { 'display': ['Playfair Display', 'serif'], 'sans': ['Inter', 'sans-serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #F5F5F7; overflow-x: hidden; }
        .font-display { font-family: 'Playfair Display', serif; }
        .navy-gradient { background: linear-gradient(135deg, #0A1628 0%, #152238 100%); }
        .gold-gradient { background: linear-gradient(135deg, #D4A84B 0%, #E8C77B 50%, #D4A84B 100%); }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); }
        .premium-shadow { box-shadow: 0 4px 20px rgba(10,22,40,0.06); }
        .premium-shadow-lg { box-shadow: 0 12px 40px rgba(10,22,40,0.12); }
        .modal-bg { background: rgba(10, 22, 40, 0.75); backdrop-filter: blur(6px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .img-thumb { position: relative; }
        .img-thumb .remove-btn { position: absolute; top: -6px; right: -6px; background: #dc2626; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; cursor: pointer; }
        .cat-preview { width: 56px; height: 56px; background: #FFFDF7; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(10,22,40,0.06); overflow: hidden; flex-shrink: 0; }
        .cat-preview img { width: 100%; height: 100%; object-fit: contain; }
        .cat-preview .emoji { font-size: 28px; line-height: 1; }
        .nav-item { transition: all 0.2s ease; }
        .nav-item.active { background: linear-gradient(135deg, #D4A84B 0%, #E8C77B 100%); color: #0A1628 !important; box-shadow: 0 4px 12px rgba(212,168,75,0.35); }
        .nav-item.active .nav-icon { color: #0A1628 !important; }
        .nav-item:not(.active) { color: rgba(255,255,255,0.8); }
        .nav-item:not(.active) .nav-icon { color: rgba(255,255,255,0.6); }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1); }
        .animate-fade-in { animation: fadeIn 0.3s ease; }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .toast { min-width: 260px; max-width: 90vw; padding: 14px 20px; border-radius: 14px; color: white; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); animation: slideDown 0.35s ease-out; pointer-events: auto; }
        .toast-success { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .toast-warn { background: linear-gradient(135deg, #ea580c, #f97316); }
        .toast-info { background: linear-gradient(135deg, #0A1628, #152238); }
        .order-status { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-confirmed { background: #DBEAFE; color: #1E40AF; }
        .status-shipped { background: #E9D5FF; color: #6B21A8; }
        .status-delivered { background: #D1FAE5; color: #065F46; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }
        input, select, textarea { font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        input:focus, select:focus, textarea:focus { border-color: #D4A84B !important; box-shadow: 0 0 0 3px rgba(212,168,75,0.12); }
        .btn-primary { background: linear-gradient(135deg, #0A1628, #152238); color: white; transition: all 0.2s ease; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(10,22,40,0.25); }
        .btn-gold { background: linear-gradient(135deg, #D4A84B, #E8C77B); color: #0A1628; transition: all 0.2s ease; }
        .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(212,168,75,0.4); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); color: white; transition: all 0.2s ease; }
        .btn-success { background: linear-gradient(135deg, #16a34a, #22c55e); color: white; transition: all 0.2s ease; }
        .cat-card { transition: all 0.15s ease; }
        .cat-card:active { transform: scale(0.98); }
        .order-item-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px; background: #F9FAFB; border-radius: 12px; margin-bottom: 8px; }
        .coupon-card { transition: all 0.15s ease; }
        .coupon-card:active { transform: scale(0.98); }
        @media (min-width: 768px) {
            body { padding-left: 240px; }
            .sidebar-desktop { display: flex !important; }
            .mobile-bottom-nav { display: none !important; }
        }
        @media (max-width: 767px) { .sidebar-desktop { display: none !important; } }
    </style>
</head>
<body class="pb-20 md:pb-6">

    <div id="toast-container"></div>

    <!-- LOADING -->
    <div id="loading-section" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl gold-gradient flex items-center justify-center animate-pulse">
                <i class="fas fa-crown text-navy text-2xl"></i>
            </div>
            <p class="text-gray-400 text-sm font-medium">Loading your workspace...</p>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="login-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 rounded-3xl navy-gradient flex items-center justify-center shadow-2xl">
                    <i class="fas fa-crown text-gold text-3xl"></i>
                </div>
                <h1 class="font-display text-3xl text-navy font-bold mb-1">Admin Control</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Heartix Premium Panel</p>
            </div>
            <div class="bg-white rounded-3xl premium-shadow-lg p-6">
                <div class="mb-4">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="email" id="admin-email" placeholder="admin@heartix.com" autocomplete="username" class="w-full border-2 border-gray-100 rounded-xl pl-11 pr-4 py-3.5 outline-none text-sm font-medium">
                    </div>
                </div>
                <div class="mb-5">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password" class="w-full border-2 border-gray-100 rounded-xl pl-11 pr-4 py-3.5 outline-none text-sm font-medium">
                    </div>
                </div>
                <button onclick="login()" id="login-btn" class="btn-primary w-full py-4 rounded-xl font-bold text-sm tracking-wide">
                    <i class="fas fa-sign-in-alt mr-2"></i> SIGN IN
                </button>
                <p id="login-error" class="text-red-500 text-xs text-center mt-4 hidden font-medium"></p>
            </div>
        </div>
    </div>

    <!-- NOT ADMIN -->
    <div id="not-admin-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl premium-shadow-lg w-full max-w-sm text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-3xl bg-red-50 flex items-center justify-center">
                <i class="fas fa-shield-halved text-red-500 text-3xl"></i>
            </div>
            <h2 class="font-display text-2xl font-bold text-navy mb-2">Access Denied</h2>
            <p class="text-sm text-gray-500 mb-6">এই অ্যাকাউন্টটি অ্যাডমিন নয়।</p>
            <button onclick="logout()" class="btn-primary w-full py-3.5 rounded-xl font-bold text-sm">
                <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="hidden min-h-screen">

        <aside class="sidebar-desktop hidden md:flex fixed left-0 top-0 bottom-0 w-[240px] navy-gradient flex-col z-40">
            <div class="p-6 border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-crown text-navy text-lg"></i>
                    </div>
                    <div>
                        <p class="text-white font-display font-bold text-lg leading-none">Heartix</p>
                        <p class="text-gold text-[10px] tracking-widest uppercase mt-1">Admin</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto hide-scrollbar">
                <p class="text-[10px] text-white/40 font-bold uppercase tracking-wider px-3 mb-2 mt-2">Main</p>
                <button onclick="showTab('dashboard')" data-tab="dashboard" class="nav-item active w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-chart-pie nav-icon w-5 text-center"></i> Dashboard
                </button>
                <button onclick="showTab('orders')" data-tab="orders" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-receipt nav-icon w-5 text-center"></i> Orders
                    <span id="orders-badge" class="ml-auto bg-gold text-navy text-[10px] font-bold rounded-full px-2 py-0.5 hidden">0</span>
                </button>
                <a href="messages.html" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-envelope nav-icon w-5 text-center"></i> Messages
                    <span id="messages-badge-sidebar" class="ml-auto bg-red-500 text-white text-[10px] font-bold rounded-full px-2 py-0.5 hidden">0</span>
                </a>
                <p class="text-[10px] text-white/40 font-bold uppercase tracking-wider px-3 mb-2 mt-6">Catalog</p>
                <button onclick="showTab('products')" data-tab="products" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-box nav-icon w-5 text-center"></i> Products
                </button>
                <button onclick="showTab('categories')" data-tab="categories" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-th-large nav-icon w-5 text-center"></i> Categories
                </button>
                <button onclick="showTab('reviews')" data-tab="reviews" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-star nav-icon w-5 text-center"></i> Reviews
                </button>
                <button onclick="showTab('coupons')" data-tab="coupons" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-ticket-alt nav-icon w-5 text-center"></i> Coupons
                </button>
                <p class="text-[10px] text-white/40 font-bold uppercase tracking-wider px-3 mb-2 mt-6">Website</p>
                <button onclick="showTab('content')" data-tab="content" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-layer-group nav-icon w-5 text-center"></i> Content
                </button>
                <button onclick="showTab('settings')" data-tab="settings" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold text-left">
                    <i class="fas fa-cog nav-icon w-5 text-center"></i> Settings
                </button>
            </nav>
            <div class="p-4 border-t border-white/10">
                <div class="bg-white/5 rounded-xl p-3 mb-3">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-gold/20 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-user-shield text-gold text-xs"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-white text-xs font-semibold truncate" id="admin-email-display"></p>
                            <p class="text-gold text-[9px] uppercase font-bold tracking-wider">Admin</p>
                        </div>
                    </div>
                </div>
                <button onclick="logout()" class="w-full text-white/70 hover:text-white text-xs font-semibold py-2.5 rounded-lg hover:bg-white/5 transition flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <header class="md:hidden glass sticky top-0 z-30 px-4 py-3 flex justify-between items-center border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center">
                    <i class="fas fa-crown text-navy text-sm"></i>
                </div>
                <div>
                    <h1 class="text-navy font-display font-bold text-base leading-none">Heartix</h1>
                    <p class="text-gold text-[9px] uppercase font-bold tracking-widest mt-0.5">Admin</p>
                </div>
            </div>
            <button onclick="logout()" class="w-9 h-9 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
                <i class="fas fa-sign-out-alt text-sm"></i>
            </button>
        </header>

        <main class="p-4 md:p-8 max-w-6xl mx-auto">
