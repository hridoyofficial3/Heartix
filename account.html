        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #FBF8F3; }
        .font-display { font-family: 'Playfair Display', serif; }
        .navy-gradient { background: linear-gradient(135deg, #0A1628 0%, #152238 100%); }
        .gold-gradient { background: linear-gradient(135deg, #D4A84B 0%, #E8C77B 50%, #D4A84B 100%); }
        .gold-text { color: #D4A84B; }
        .navy-text { color: #0A1628; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); }
        .premium-shadow { box-shadow: 0 4px 20px rgba(10,22,40,0.08); }
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { background: linear-gradient(135deg, #0A1628, #152238); color: white; }
        #toast-container { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; pointer-events: none; }
        .toast-bar { padding: 14px 20px; color: white; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; animation: slideDown 0.3s ease; justify-content: center; }
        .toast-bar.success { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .toast-bar.error { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .toast-bar.warn { background: linear-gradient(135deg, #ea580c, #f97316); }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        input:focus, select:focus { border-color: #D4A84B !important; }
        .field-error { border-color: #dc2626 !important; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-confirmed { background: #DBEAFE; color: #1E40AF; }
        .status-shipped { background: #E9D5FF; color: #6B21A8; }
        .status-delivered { background: #D1FAE5; color: #065F46; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }
    </style>
</head>
<body class="pb-8">

    <div id="toast-container"></div>

    <!-- ⚡ BULLETPROOF FALLBACK: Firebase fail হলেও login form দেখাবে -->
    <script>
        (function() {
            // 4 seconds পর form force-show
            setTimeout(function() {
                var loading = document.getElementById('loading');
                var auth = document.getElementById('auth-section');
                var logged = document.getElementById('logged-section');
                if (loading && !loading.classList.contains('hidden')) {
                    loading.classList.add('hidden');
                    if (auth && (!logged || logged.classList.contains('hidden'))) {
                        auth.classList.remove('hidden');
                    }
                    console.log('Fallback triggered at ' + new Date().toLocaleTimeString());
                }
            }, 4000);
        })();
    </script>

    <!-- ====== FALLBACK FUNCTIONS (Plain JS — module fail হলেও কাজ করবে) ====== -->
    <script>
        // Tab switch — module fail হলেও কাজ করবে
        window.switchTab = function(tab) {
            var loginTab = document.getElementById('tab-login');
            var regTab = document.getElementById('tab-register');
            var loginForm = document.getElementById('login-form');
            var regForm = document.getElementById('register-form');
            if (tab === 'login') {
                if (loginTab) loginTab.classList.add('active');
                if (regTab) regTab.classList.remove('active');
                if (loginForm) loginForm.classList.remove('hidden');
                if (regForm) regForm.classList.add('hidden');
            } else {
                if (regTab) regTab.classList.add('active');
                if (loginTab) loginTab.classList.remove('active');
                if (regForm) regForm.classList.remove('hidden');
                if (loginForm) loginForm.classList.add('hidden');
            }
        };

        // Placeholder functions — module load হলে override হবে
        window.loginUser = window.loginUser || function() { alert('Firebase লোড হচ্ছে... কিছুক্ষণ পর চেষ্টা করুন'); };
        window.registerUser = window.registerUser || function() { alert('Firebase লোড হচ্ছে... কিছুক্ষণ পর চেষ্টা করুন'); };
        window.forgotPassword = window.forgotPassword || function() { alert('Firebase লোড হচ্ছে...'); };
        window.logoutUser = window.logoutUser || function() { location.reload(); };
        window.saveProfile = window.saveProfile || function() { alert('Firebase লোড হচ্ছে...'); };
        window.loadMyOrders = window.loadMyOrders || function() {};

        // Initial cart badge
        (function() {
            try {
                var cart = JSON.parse(localStorage.getItem('heartix_cart') || '[]');
                var count = cart.reduce(function(s, i) { return s + (Number(i.quantity) || 0); }, 0);
                var h = document.getElementById('cart-count-header');
                if (h) h.textContent = count;
            } catch(e) {}
        })();
    </script>

    <!-- ====== FIREBASE MODULE ====== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJMggVKtyP6c9qtb7rYE_3jh01l4me4w",
            authDomain: "heartix.firebaseapp.com",
            projectId: "heartix",
            storageBucket: "heartix.firebasestorage.app",
            messagingSenderId: "551204402338",
            appId: "1:551204402338:web:169555975c0bbb97f113fb"
        };

        let db = null, auth = null, currentUser = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) { console.error('Firebase init:', e); }

        function showToast(msg, type) {
            type = type || 'success';
            const c = document.getElementById('toast-container');
            if (!c) return;
            const t = document.createElement('div');
            t.className = 'toast-bar ' + type;
            const icon = type === 'success' ? 'check-circle' : (type === 'warn' ? 'exclamation-circle' : 'times-circle');
            t.innerHTML = '<i class="fas fa-' + icon + '"></i><span>' + msg + '</span>';
            c.appendChild(t);
            setTimeout(function() {
                t.style.transition = 'opacity 0.3s';
                t.style.opacity = '0';
                setTimeout(function() { t.remove(); }, 300);
            }, 3000);
        }

        function escapeHtml(t) { if (t === null || t === undefined) return ''; const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }
        function formatPrice(n) { return Number(n || 0).toLocaleString('en-IN'); }
        function validatePhone(p) { return /^01[3-9]\d{8}$/.test(p); }

        // ====== AUTH STATE ======
        if (auth) {
            onAuthStateChanged(auth, async function(user) {
                document.getElementById('loading').classList.add('hidden');
                if (user) {
                    currentUser = user;
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('logged-section').classList.remove('hidden');
                    try {
                        await loadProfile();
                        loadMyOrders();
                        updateBadges();
                    } catch (e) { console.error('Profile load error:', e); }
                } else {
                    currentUser = null;
                    document.getElementById('auth-section').classList.remove('hidden');
                    document.getElementById('logged-section').classList.add('hidden');
                }
            });
        } else {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }

        // ====== REGISTER (override fallback) ======
        window.registerUser = async function() {
            const name = (document.getElementById('reg-name').value || '').trim();
            const phone = (document.getElementById('reg-phone').value || '').trim();
            const email = (document.getElementById('reg-email').value || '').trim();
            const password = document.getElementById('reg-password').value || '';
            const confirm = document.getElementById('reg-confirm').value || '';

            if (!name || name.length < 2) return showToast('সঠিক নাম দিন', 'error');
            if (!validatePhone(phone)) return showToast('সঠিক ফোন নাম্বার (01XXXXXXXXX)', 'error');
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('সঠিক ইমেইল দিন', 'error');
            if (!password || password.length < 6) return showToast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর', 'error');
            if (password !== confirm) return showToast('পাসওয়ার্ড দুইটা মিলছে না', 'error');

            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating...';

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                try { await updateProfile(cred.user, { displayName: name }); } catch(e) {}
                try {
                    await setDoc(doc(db, "customers", cred.user.uid), {
                        uid: cred.user.uid,
                        name: name, phone: phone, email: email,
                        createdAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) { console.warn('Profile save failed:', e); }

                showToast('Account তৈরি হয়েছে!', 'success');
                ['reg-name','reg-phone','reg-email','reg-password','reg-confirm'].forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) el.value = '';
                });
            } catch (e) {
                let msg = 'রেজিস্ট্রেশন ব্যর্থ';
                if (e.code === 'auth/email-already-in-use') msg = 'এই ইমেইল আগেই ব্যবহৃত';
                else if (e.code === 'auth/weak-password') msg = 'পাসওয়ার্ড দুর্বল';
                else if (e.code === 'auth/invalid-email') msg = 'সঠিক ইমেইল দিন';
                else if (e.code === 'auth/network-request-failed') msg = 'ইন্টারনেট সমস্যা';
                showToast(msg, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus mr-2"></i> REGISTER';
            }
        };

        // ====== LOGIN ======
        window.loginUser = async function() {
            const email = (document.getElementById('login-email').value || '').trim();
            const password = document.getElementById('login-password').value || '';
            if (!email || !password) return showToast('ইমেইল ও পাসওয়ার্ড দিন', 'error');

            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('login-password').value = '';
                showToast('সফলভাবে লগইন হয়েছেন', 'success');
            } catch (e) {
                let msg = 'লগইন ব্যর্থ';
                if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'ইমেইল বা পাসওয়ার্ড ভুল';
                else if (e.code === 'auth/user-not-found') msg = 'এই ইমেইলে account নেই';
                else if (e.code === 'auth/invalid-email') msg = 'সঠিক ইমেইল দিন';
                else if (e.code === 'auth/too-many-requests') msg = 'অনেকবার ভুল — কিছুক্ষণ পর চেষ্টা';
                showToast(msg, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> LOGIN';
            }
        };

        // ====== FORGOT ======
        window.forgotPassword = async function() {
            const email = (document.getElementById('login-email').value || '').trim();
            if (!email) return showToast('প্রথমে ইমেইল লিখুন', 'warn');
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Reset link ইমেইলে পাঠানো হয়েছে', 'success');
            } catch (e) {
                showToast('পাঠানো যায়নি — ইমেইল চেক করুন', 'error');
            }
        };

        // ====== LOGOUT ======
        window.logoutUser = async function() {
            if (!confirm('Logout করবেন?')) return;
            try { await signOut(auth); showToast('Logout হয়েছে', 'warn'); } catch (e) {}
        };

        // ====== PROFILE ======
        async function loadProfile() {
            if (!currentUser) return;
            const fallbackName = currentUser.displayName || (currentUser.email || '').split('@')[0] || 'User';
            document.getElementById('user-display-name').textContent = fallbackName;
            document.getElementById('user-display-email').textContent = currentUser.email || '-';
            document.getElementById('user-avatar-letter').textContent = (fallbackName[0] || 'U').toUpperCase();
            document.getElementById('profile-name').value = fallbackName;
            document.getElementById('profile-phone').value = '';

            try {
                const snap = await getDoc(doc(db, "customers", currentUser.uid));
                if (snap.exists()) {
                    const d = snap.data();
                    if (d.name) {
                        document.getElementById('user-display-name').textContent = d.name;
                        document.getElementById('profile-name').value = d.name;
                        document.getElementById('user-avatar-letter').textContent = (d.name[0] || 'U').toUpperCase();
                    }
                    if (d.phone) document.getElementById('profile-phone').value = d.phone;
                }
            } catch (e) { console.warn('Profile load:', e); }
        }

        window.saveProfile = async function() {
            if (!currentUser) return;
            const name = (document.getElementById('profile-name').value || '').trim();
            const phone = (document.getElementById('profile-phone').value || '').trim();
            if (!name || name.length < 2) return showToast('সঠিক নাম দিন', 'error');
            if (phone && !validatePhone(phone)) return showToast('সঠিক ফোন নাম্বার দিন', 'error');

            const btn = document.getElementById('save-profile-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Saving...';

            try {
                await setDoc(doc(db, "customers", currentUser.uid), {
                    name: name, phone: phone, email: currentUser.email
                }, { merge: true });
                try { await updateProfile(currentUser, { displayName: name }); } catch (e) {}
                document.getElementById('user-display-name').textContent = name;
                document.getElementById('user-avatar-letter').textContent = (name[0] || 'U').toUpperCase();
                showToast('প্রোফাইল সেভ হয়েছে', 'success');
            } catch (e) {
                showToast('সেভ করা যায়নি', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-1"></i> Save Changes';
            }
        };

        // ====== MY ORDERS ======
        window.loadMyOrders = async function() {
            const list = document.getElementById('my-orders-list');
            if (!currentUser || !list) return;
            list.innerHTML = '<p class="text-xs text-gray-400 text-center py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Loading...</p>';

            try {
                const allSnap = await getDocs(collection(db, "orders"));
                let orders = [];
                allSnap.forEach(function(d) {
                    const data = d.data();
                    if (data.customer && data.customer.email === currentUser.email) orders.push({ id: d.id, ...data });
                });
                orders.sort(function(a, b) {
                    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
                    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
                    return tb - ta;
                });

                if (orders.length === 0) {
                    list.innerHTML = '<div class="text-center py-8">' +
                        '<i class="fas fa-receipt text-4xl text-gray-200 mb-3"></i>' +
                        '<p class="text-xs text-gray-500">এখনো কোনো অর্ডার নেই</p>' +
                        '<a href="index.html" class="inline-block mt-3 navy-gradient text-white px-5 py-2 rounded-lg text-[11px] font-semibold">শপিং করুন</a>' +
                        '</div>';
                    return;
                }

                let html = '';
                orders.slice(0, 10).forEach(function(o) {
                    const statusClass = 'status-' + (o.status || 'pending');
                    const date = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
                    html += '<a href="track-order.html?order=' + encodeURIComponent(o.orderNumber || '') + '" class="block bg-gray-50 rounded-xl p-3 active:bg-gray-100">' +
                        '<div class="flex justify-between items-start mb-2">' +
                        '<div class="min-w-0">' +
                        '<p class="font-bold text-navy text-xs">' + escapeHtml(o.orderNumber || '') + '</p>' +
                        '<p class="text-[10px] text-gray-500 mt-0.5">' + date + ' • ' + (o.items || []).length + ' item(s)</p>' +
                        '</div>' +
                        '<span class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase ' + statusClass + '">' + (o.status || 'pending') + '</span>' +
                        '</div>' +
                        '<div class="flex justify-between items-baseline">' +
                        '<span class="text-[10px] text-gray-500">Total</span>' +
                        '<span class="font-bold text-navy text-sm">৳' + formatPrice(o.total) + '</span>' +
                        '</div>' +
                        '</a>';
                });
                list.innerHTML = html;
            } catch (e) {
                console.error('Orders:', e);
                list.innerHTML = '<p class="text-xs text-red-500 text-center py-4">লোড করা যায়নি</p>';
            }
        };

        // ====== BADGES ======
        function updateBadges() {
            try {
                const cart = JSON.parse(localStorage.getItem('heartix_cart') || '[]');
                const cCount = cart.reduce(function(s, i) { return s + (Number(i.quantity) || 0); }, 0);
                const el = document.getElementById('cart-count-header');
                if (el) el.textContent = cCount;
                const ct = document.getElementById('cart-count-text');
                if (ct) ct.textContent = cCount;

                const wl = JSON.parse(localStorage.getItem('heartix_wishlist') || '[]');
                const wCount = Array.isArray(wl) ? wl.length : 0;
                const we = document.getElementById('wishlist-count');
                if (we) we.textContent = wCount;
            } catch (e) {}
        }
    </script>
</body>
</html>
