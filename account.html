<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/account.css">
</head>
<body class="pb-8">

    <div id="toast-container"></div>

    <header class="glass sticky top-0 z-30 px-3 py-2 flex justify-between items-center border-b border-gray-100">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-cream">
            <i class="fas fa-arrow-left text-navy text-lg"></i>
        </a>
        <h1 class="font-display text-xl navy-text font-bold">My Account</h1>
        <a href="cart.html" class="relative w-10 h-10 flex items-center justify-center">
            <i class="fas fa-shopping-bag text-navy text-lg"></i>
            <span id="cart-count-header" class="absolute -top-1 -right-1 gold-gradient text-navy text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
    </header>

    <div class="p-4 max-w-md mx-auto">

        <!-- LOADING -->
        <div id="loading" class="text-center py-16">
            <i class="fas fa-spinner fa-spin text-3xl gold-text mb-3"></i>
            <p class="text-gray-400 text-sm">Loading...</p>
        </div>

        <!-- AUTH SECTION -->
        <div id="auth-section" class="hidden">

            <div class="text-center mb-6">
                <div class="w-20 h-20 mx-auto mb-3 gold-gradient rounded-3xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-user text-navy text-3xl"></i>
                </div>
                <h2 class="font-display text-2xl navy-text font-bold mb-1">Welcome to Heartix</h2>
                <p class="text-xs text-gray-500">Login or create your account</p>
            </div>

            <div class="bg-white rounded-2xl p-1 flex mb-4 premium-shadow">
                <button id="tab-login" onclick="switchTab('login')" class="tab-btn active flex-1 py-2.5 rounded-xl text-xs font-bold text-gray-500">
                    Login
                </button>
                <button id="tab-register" onclick="switchTab('register')" class="tab-btn flex-1 py-2.5 rounded-xl text-xs font-bold text-gray-500">
                    Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <div id="login-form" class="bg-white rounded-2xl premium-shadow p-5">
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" maxlength="120" autocomplete="email" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <div class="mb-4">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" maxlength="60" autocomplete="current-password" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <button onclick="loginUser()" id="login-btn" class="navy-gradient text-white w-full py-3.5 rounded-xl font-bold text-sm">
                    <i class="fas fa-sign-in-alt mr-2"></i> LOGIN
                </button>
                <button onclick="forgotPassword()" class="w-full text-xs text-gray-500 mt-3 py-2 font-semibold">
                    পাসওয়ার্ড ভুলে গেছেন?
                </button>
            </div>

            <!-- REGISTER FORM -->
            <div id="register-form" class="bg-white rounded-2xl premium-shadow p-5 hidden">
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Full Name *</label>
                    <input type="text" id="reg-name" placeholder="আপনার নাম" maxlength="60" autocomplete="name" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Phone *</label>
                    <input type="tel" id="reg-phone" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Email *</label>
                    <input type="email" id="reg-email" placeholder="you@example.com" maxlength="120" autocomplete="email" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Password * (min 6)</label>
                    <input type="password" id="reg-password" placeholder="••••••••" maxlength="60" autocomplete="new-password" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <div class="mb-4">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Confirm Password *</label>
                    <input type="password" id="reg-confirm" placeholder="••••••••" maxlength="60" autocomplete="new-password" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm">
                </div>
                <button onclick="registerUser()" id="register-btn" class="navy-gradient text-white w-full py-3.5 rounded-xl font-bold text-sm">
                    <i class="fas fa-user-plus mr-2"></i> REGISTER
                </button>
                <p class="text-[10px] text-gray-400 text-center mt-3 leading-relaxed">
                    রেজিস্টার করলে আপনি আমাদের <a href="terms.html" class="text-gold font-semibold">Terms</a> এবং <a href="privacy.html" class="text-gold font-semibold">Privacy Policy</a> মেনে নিচ্ছেন।
                </p>
            </div>

        </div>

        <!-- LOGGED IN SECTION -->
        <div id="logged-section" class="hidden space-y-4">

            <div class="navy-gradient rounded-3xl p-6 text-white relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-16 -mt-16"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-[#D4A84B]/10 rounded-full -ml-12 -mb-12"></div>
                <div class="relative flex items-center gap-4">
                    <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center flex-shrink-0">
                        <span id="user-avatar-letter" class="text-navy text-2xl font-bold">U</span>
                    </div>
                    <div class="min-w-0 flex-1">
                        <p class="text-[10px] text-gold tracking-widest uppercase font-bold mb-1">Welcome back</p>
                        <p id="user-display-name" class="font-display text-xl font-bold truncate">User</p>
                        <p id="user-display-email" class="text-white/60 text-xs truncate mt-0.5">-</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl premium-shadow overflow-hidden">
                <a href="wishlist.html" class="flex items-center gap-3 p-4 active:bg-gray-50 border-b border-gray-100">
                    <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-heart text-red-500"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold navy-text">My Wishlist</p>
                        <p class="text-[11px] text-gray-500"><span id="wishlist-count">0</span> items</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </a>
                <a href="cart.html" class="flex items-center gap-3 p-4 active:bg-gray-50 border-b border-gray-100">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-shopping-bag text-blue-500"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold navy-text">My Cart</p>
                        <p class="text-[11px] text-gray-500"><span id="cart-count-text">0</span> items</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </a>
                <a href="track-order.html" class="flex items-center gap-3 p-4 active:bg-gray-50">
                    <div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-truck-fast text-purple-500"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold navy-text">Track Order</p>
                        <p class="text-[11px] text-gray-500">অর্ডার ট্র্যাক করুন</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </a>
            </div>

            <div class="bg-white rounded-2xl premium-shadow p-5">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
                    <h3 class="font-display text-base navy-text font-bold flex items-center gap-2">
                        <i class="fas fa-receipt gold-text text-sm"></i> My Orders
                    </h3>
                    <button onclick="loadMyOrders()" class="text-gold text-xs font-bold">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div id="my-orders-list" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-2xl premium-shadow p-5">
                <h3 class="font-display text-base navy-text font-bold mb-4 pb-3 border-b border-gray-100 flex items-center gap-2">
                    <i class="fas fa-user-circle gold-text text-sm"></i> Account Info
                </h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">Name</label>
                        <input type="text" id="profile-name" maxlength="60" class="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 outline-none text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">Phone</label>
                        <input type="tel" id="profile-phone" maxlength="11" inputmode="numeric" class="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 outline-none text-sm">
                    </div>
                    <button onclick="saveProfile()" id="save-profile-btn" class="navy-gradient text-white w-full py-3 rounded-xl text-xs font-bold">
                        <i class="fas fa-save mr-1"></i> Save Changes
                    </button>
                </div>
            </div>

            <button onclick="logoutUser()" class="w-full bg-red-50 text-red-500 py-3.5 rounded-2xl font-bold text-sm active:scale-[0.98] transition">
                <i class="fas fa-sign-out-alt mr-1"></i> Logout
            </button>

        </div>

    </div>

    <!-- FALLBACK (before module loads) -->
    <script>
        window.switchTab = window.switchTab || function(tab) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            if (tab === 'login') {
                if (loginTab) loginTab.classList.add('active');
                if (regTab) regTab.classList.remove('active');
                if (loginForm) loginForm.classList.remove('hidden');
                if (regForm) regForm.classList.add('hidden');
            } else {
                if (regTab) regTab.classList.add('active');
                if (loginTab) loginTab.classList.remove('active');
                if (regForm) regForm.classList.remove('hidden');
                if (loginForm) loginForm.classList.add('hidden');
            }
        };
        window.loginUser = window.loginUser || function() { alert('Firebase লোড হচ্ছে...'); };
        window.registerUser = window.registerUser || function() { alert('Firebase লোড হচ্ছে...'); };
        window.forgotPassword = window.forgotPassword || function() { alert('Firebase লোড হচ্ছে...'); };
        window.logoutUser = window.logoutUser || function() { location.reload(); };
        window.saveProfile = window.saveProfile || function() { alert('Firebase লোড হচ্ছে...'); };
        window.loadMyOrders = window.loadMyOrders || function() {};

        // Initial cart badge
        (function() {
            try {
                var cart = JSON.parse(localStorage.getItem('heartix_cart') || '[]');
                var count = cart.reduce(function(s, i) { return s + (Number(i.quantity) || 0); }, 0);
                var h = document.getElementById('cart-count-header');
                if (h) h.textContent = count;
            } catch(e) {}
        })();
    </script>

    <script type="module" src="js/account.js"></script>
</body>
</html>
