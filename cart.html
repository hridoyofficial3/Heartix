<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .brand-navy { color: #0B1B3D; }
        .brand-bg-navy { background-color: #0B1B3D; }
    </style>
</head>
<body class="bg-gray-50 pb-20 font-sans">

    <header class="bg-white sticky top-0 z-50 shadow-sm p-4 flex justify-between items-center">
        <a href="index.html"><i class="fas fa-arrow-left text-xl text-gray-700"></i></a>
        <h1 class="text-xl font-bold brand-navy">Shopping Cart</h1>
        <div class="w-6"></div>
    </header>

    <div class="p-4">
        <div id="cart-items" class="space-y-3"></div>

        <div id="empty-cart" class="hidden text-center py-16">
            <i class="fas fa-shopping-cart text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">আপনার কার্ট খালি!</p>
            <a href="index.html" class="inline-block mt-4 brand-bg-navy text-white px-6 py-2 rounded-lg">শপিং শুরু করুন</a>
        </div>

        <div id="cart-summary" class="hidden bg-white rounded-lg shadow-sm p-4 mt-6">
            <div class="flex justify-between mb-2">
                <span class="text-gray-600">Subtotal:</span>
                <span id="subtotal" class="font-semibold">৳ 0</span>
            </div>
            <div class="flex justify-between mb-2">
                <span class="text-gray-600">Delivery Charge:</span>
                <span id="delivery-charge" class="font-semibold">৳ 100</span>
            </div>
            <div class="border-t pt-2 mt-2 flex justify-between">
                <span class="font-bold text-lg">Total:</span>
                <span id="total" class="font-bold text-lg brand-navy">৳ 0</span>
            </div>
            <a href="checkout.html" class="block w-full brand-bg-navy text-white text-center py-3 rounded-lg mt-4 hover:opacity-90">Proceed to Checkout</a>
        </div>
    </div>

    <script>
        const DELIVERY_CHARGE = 100;

        function getCart() {
            const cart = localStorage.getItem('heartix_cart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('heartix_cart', JSON.stringify(cart));
        }

        function renderCart() {
            const cart = getCart();
            const cartItemsDiv = document.getElementById('cart-items');
            const emptyCart = document.getElementById('empty-cart');
            const cartSummary = document.getElementById('cart-summary');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '';
                emptyCart.classList.remove('hidden');
                cartSummary.classList.add('hidden');
                return;
            }

            emptyCart.classList.add('hidden');
            cartSummary.classList.remove('hidden');

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                subtotal += item.price * item.quantity;
                html += `
                    <div class="bg-white rounded-lg shadow-sm p-3 flex items-center gap-3">
                        <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
                        <div class="flex-1">
                            <h4 class="text-sm font-medium text-gray-800">${item.name}</h4>
                            <p class="brand-navy font-bold text-sm mt-1">৳ ${item.price}</p>
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="changeQty(${index}, -1)" class="w-7 h-7 bg-gray-100 rounded flex items-center justify-center">−</button>
                                <span class="font-semibold">${item.quantity}</span>
                                <button onclick="changeQty(${index}, 1)" class="w-7 h-7 bg-gray-100 rounded flex items-center justify-center">+</button>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold brand-navy">৳ ${item.price * item.quantity}</p>
                            <button onclick="removeItem(${index})" class="text-red-500 text-sm mt-2"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            cartItemsDiv.innerHTML = html;
            document.getElementById('subtotal').innerText = '৳ ' + subtotal;
            document.getElementById('delivery-charge').innerText = '৳ ' + DELIVERY_CHARGE;
            document.getElementById('total').innerText = '৳ ' + (subtotal + DELIVERY_CHARGE);
        }

        function changeQty(index, change) {
            let cart = getCart();
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            saveCart(cart);
            renderCart();
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
