<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cart - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #FBF8F3; overflow-x: hidden; }
        .font-display { font-family: 'Playfair Display', serif; }
        .navy-bg { background: #0A1628; }
        .navy-gradient { background: linear-gradient(135deg, #0A1628 0%, #152238 100%); }
        .gold-gradient { background: linear-gradient(135deg, #D4A84B 0%, #E8C77B 50%, #D4A84B 100%); }
        .gold-text { color: #D4A84B; }
        .navy-text { color: #0A1628; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .premium-shadow { box-shadow: 0 4px 20px rgba(10,22,40,0.08); }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        .shimmer { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 1000px 100%; animation: shimmer 1.5s infinite; }
        #toast-container { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; pointer-events: none; }
        .toast-bar { padding: 14px 20px; color: white; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; animation: slideDown 0.3s ease; justify-content: center; }
        .toast-bar.success { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .toast-bar.error { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .toast-bar.warn { background: linear-gradient(135deg, #ea580c, #f97316); }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        .prod-img { object-fit: contain; background: #f9fafb; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
        .coupon-input:focus { border-color: #D4A84B !important; box-shadow: 0 0 0 3px rgba(212,168,75,0.12); }
    </style>
</head>
<body class="pb-24">

    <div id="toast-container"></div>

    <!-- HEADER -->
    <header class="glass sticky top-0 z-30 px-3 py-2 flex justify-between items-center border-b border-gray-100">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-cream">
            <i class="fas fa-arrow-left text-navy text-lg"></i>
        </a>
        <h1 class="font-display text-xl navy-text font-bold">Shopping Cart</h1>
        <button id="clear-cart-btn" onclick="clearCart()" class="hidden w-10 h-10 items-center justify-center rounded-full hover:bg-red-50 text-red-500" title="Clear cart">
            <i class="fas fa-trash-alt text-base"></i>
        </button>
    </header>

    <div class="p-4 max-w-2xl mx-auto">
        <!-- SKELETON -->
        <div id="loading-skeleton" class="space-y-3">
            <div class="bg-white rounded-2xl p-4 premium-shadow">
                <div class="flex gap-3">
                    <div class="w-20 h-20 shimmer rounded-xl"></div>
                    <div class="flex-1">
                        <div class="h-4 w-3/4 shimmer rounded mb-2"></div>
                        <div class="h-4 w-1/2 shimmer rounded mb-2"></div>
                        <div class="h-8 w-24 shimmer rounded"></div>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-4 premium-shadow">
                <div class="flex gap-3">
                    <div class="w-20 h-20 shimmer rounded-xl"></div>
                    <div class="flex-1">
                        <div class="h-4 w-3/4 shimmer rounded mb-2"></div>
                        <div class="h-4 w-1/2 shimmer rounded mb-2"></div>
                        <div class="h-8 w-24 shimmer rounded"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ERROR STATE -->
        <div id="error-state" class="hidden bg-white rounded-2xl p-8 text-center premium-shadow">
            <i class="fas fa-exclamation-triangle text-5xl text-yellow-400 mb-3"></i>
            <p class="text-gray-600 font-semibold mb-2">লোড করা যায়নি</p>
            <p class="text-xs text-gray-400 mb-4">ইন্টারনেট সংযোগ চেক করুন</p>
            <button onclick="location.reload()" class="navy-gradient text-white px-5 py-2.5 rounded-xl text-xs font-semibold">
                <i class="fas fa-redo mr-1"></i> আবার চেষ্টা করুন
            </button>
        </div>

        <!-- CART ITEMS -->
        <div id="cart-items" class="space-y-3 hidden"></div>

        <!-- EMPTY CART -->
        <div id="empty-cart" class="hidden text-center py-16">
            <i class="fas fa-shopping-bag text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg font-medium">আপনার কার্ট খালি!</p>
            <p class="text-gray-400 text-sm mt-1">শপিং শুরু করে কিছু যোগ করুন</p>
            <a href="index.html" class="inline-block mt-5 navy-gradient text-white px-8 py-3 rounded-xl font-semibold text-sm">
                <i class="fas fa-shopping-bag mr-2"></i> শপিং শুরু করুন
            </a>
        </div>

        <!-- SUMMARY -->
        <div id="cart-summary" class="hidden bg-white rounded-2xl premium-shadow p-5 mt-6">
            <h3 class="font-display text-lg navy-text font-bold mb-4 pb-3 border-b border-gray-100">Order Summary</h3>

            <!-- COUPON INPUT -->
            <div id="coupon-block" class="mb-4">
                <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">
                    <i class="fas fa-ticket-alt gold-text mr-1"></i>Have a coupon?
                </label>
                <div id="coupon-input-wrap" class="flex gap-2">
                    <input type="text" id="coupon-input" placeholder="Enter code" maxlength="20" class="coupon-input flex-1 border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm font-bold uppercase tracking-wider">
                    <button onclick="applyCoupon()" id="coupon-apply-btn" class="navy-gradient text-white px-5 py-3 rounded-xl text-xs font-bold whitespace-nowrap">
                        Apply
                    </button>
                </div>
                <div id="coupon-applied" class="hidden flex items-center justify-between bg-green-50 border border-green-200 rounded-xl p-3 mt-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <i class="fas fa-check-circle text-green-600"></i>
                        <div class="min-w-0">
                            <p id="coupon-applied-code" class="text-xs font-bold text-green-700"></p>
                            <p id="coupon-applied-desc" class="text-[10px] text-green-600 truncate"></p>
                        </div>
                    </div>
                    <button onclick="removeCoupon()" class="text-red-500 text-xs font-bold ml-2 flex-shrink-0">
                        <i class="fas fa-times-circle"></i> Remove
                    </button>
                </div>
                <p id="coupon-error" class="hidden text-red-500 text-xs mt-2"></p>
            </div>

            <div class="flex justify-between mb-3 text-sm">
                <span class="text-gray-600">Subtotal (<span id="cart-count-summary">0</span> items)</span>
                <span id="subtotal" class="font-semibold navy-text">৳ 0</span>
            </div>

            <div id="discount-row" class="hidden flex justify-between mb-3 text-sm">
                <span class="text-green-600">Discount</span>
                <span id="discount-amount" class="font-semibold text-green-600">-৳ 0</span>
            </div>

            <div class="flex justify-between mb-3 text-sm">
                <span class="text-gray-600">Delivery Charge</span>
                <span id="delivery-charge" class="font-semibold navy-text">৳ 0</span>
            </div>

            <div id="free-delivery-note" class="hidden bg-green-50 border border-green-200 text-green-700 text-xs p-3 rounded-lg mb-3">
                <i class="fas fa-check-circle mr-1"></i> আপনি <span id="free-delivery-amount"></span> টাকার অর্ডারে ফ্রি ডেলিভারি পেয়েছেন!
            </div>

            <div id="free-delivery-hint" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 text-xs p-3 rounded-lg mb-3">
                <i class="fas fa-info-circle mr-1"></i> <span id="free-delivery-hint-text"></span>
            </div>

            <div id="stock-warning-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg mb-3">
                <i class="fas fa-exclamation-triangle mr-1"></i> <span id="stock-warning-text"></span>
            </div>

            <div class="border-t border-gray-100 pt-3 mt-3 flex justify-between items-baseline">
                <span class="font-bold navy-text">Total</span>
                <span id="total" class="font-display text-2xl font-bold navy-text">৳ 0</span>
            </div>

            <button id="checkout-btn" onclick="proceedToCheckout()" class="block w-full navy-gradient text-white text-center py-3.5 rounded-xl mt-5 font-semibold text-sm">
                <i class="fas fa-arrow-right mr-2"></i> Proceed to Checkout
            </button>

            <a href="index.html" class="block w-full text-center text-gray-500 text-xs mt-3 py-2">
                <i class="fas fa-plus mr-1"></i> আরও শপিং করুন
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJMggVKtyP6c9qtb7rYE_3jh01l4me4w",
            authDomain: "heartix.firebaseapp.com",
            projectId: "heartix",
            storageBucket: "heartix.firebasestorage.app",
            messagingSenderId: "551204402338",
            appId: "1:551204402338:web:169555975c0bbb97f113fb"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) { console.error('Firebase init:', e); }

        let settings = { deliveryCharge: 100, freeDeliveryAbove: 0 };
        let allProductsMap = {};
        let isLoading = true;
        let loadFailed = false;

        // Coupon state (stored in localStorage so checkout can use it)
        let appliedCoupon = null;

        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            if (!c) return;
            const t = document.createElement('div');
            t.className = 'toast-bar ' + type;
            const icon = type === 'success' ? 'check-circle' : (type === 'warn' ? 'exclamation-circle' : 'times-circle');
            t.innerHTML = `<i class="fas fa-${icon}"></i><span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => {
                t.style.transition = 'opacity 0.3s';
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 300);
            }, 2500);
        }
        window.showToast = showToast;

        function escapeHtml(t) {
            if (t === null || t === undefined) return '';
            const d = document.createElement('div');
            d.textContent = String(t);
            return d.innerHTML;
        }
        function formatPrice(n) { return Number(n || 0).toLocaleString('en-IN'); }

        function getCart() {
            try {
                const raw = JSON.parse(localStorage.getItem('heartix_cart') || '[]');
                if (!Array.isArray(raw)) return [];
                return raw.filter(i => i && typeof i === 'object' && i.id && (Number(i.quantity) || 0) > 0);
            } catch (e) { return []; }
        }
        function saveCart(c) {
            try { localStorage.setItem('heartix_cart', JSON.stringify(c)); } catch (e) {}
        }

        function getWishlist() {
            try { const w = JSON.parse(localStorage.getItem('heartix_wishlist') || '[]'); return Array.isArray(w) ? w : []; } catch (e) { return []; }
        }
        function saveWishlist(w) {
            try { localStorage.setItem('heartix_wishlist', JSON.stringify(w)); } catch (e) {}
        }

        function getStock(productId) {
            const p = allProductsMap[productId];
            if (!p) return null;
            return p.stock !== undefined ? Number(p.stock) : 999;
        }

        // Load saved coupon from localStorage (if exists)
        try {
            const saved = JSON.parse(localStorage.getItem('heartix_coupon') || 'null');
            if (saved && saved.code) appliedCoupon = saved;
        } catch (e) {}

        // ============ LOAD DATA ============
        async function loadData() {
            if (!db) {
                isLoading = false;
                loadFailed = true;
                renderCart();
                return;
            }
            try {
                const [setSnap, prodSnap] = await Promise.all([
                    getDoc(doc(db, "settings", "main")).catch(() => null),
                    getDocs(collection(db, "products")).catch(() => null)
                ]);

                if (setSnap && setSnap.exists()) {
                    const s = setSnap.data();
                    settings.deliveryCharge = Number(s.deliveryCharge) || 100;
                    settings.freeDeliveryAbove = Number(s.freeDeliveryAbove) || 0;
                }

                if (prodSnap) {
                    prodSnap.forEach(d => {
                        allProductsMap[d.id] = { id: d.id, ...d.data() };
                    });
                }
            } catch (e) {
                console.error('Load error:', e);
                loadFailed = true;
            }
            isLoading = false;
            renderCart();
        }

        // ============ RENDER ============
        function renderCart() {
            const skeleton = document.getElementById('loading-skeleton');
            const errorState = document.getElementById('error-state');
            const cartItemsDiv = document.getElementById('cart-items');
            const emptyCart = document.getElementById('empty-cart');
            const cartSummary = document.getElementById('cart-summary');
            const clearBtn = document.getElementById('clear-cart-btn');

            skeleton.classList.add('hidden');

            if (loadFailed) {
                errorState.classList.remove('hidden');
                cartItemsDiv.classList.add('hidden');
                emptyCart.classList.add('hidden');
                cartSummary.classList.add('hidden');
                clearBtn.classList.remove('flex'); clearBtn.classList.add('hidden');
                return;
            }
            errorState.classList.add('hidden');

            const cart = getCart();

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '';
                cartItemsDiv.classList.add('hidden');
                emptyCart.classList.remove('hidden');
                cartSummary.classList.add('hidden');
                clearBtn.classList.remove('flex'); clearBtn.classList.add('hidden');
                return;
            }

            emptyCart.classList.add('hidden');
            cartItemsDiv.classList.remove('hidden');
            cartSummary.classList.remove('hidden');
            clearBtn.classList.remove('hidden'); clearBtn.classList.add('flex');

            let html = '';
            let subtotal = 0;
            let hasStockIssue = false;
            let hasMissingProduct = false;

            cart.forEach((item, index) => {
                const stock = getStock(item.id);
                const qty = Number(item.quantity) || 0;
                const price = Number(item.price) || 0;
                const lineTotal = price * qty;
                subtotal += lineTotal;

                const productMissing = stock === null;
                const notEnoughStock = !productMissing && stock !== 999 && qty > stock;
                if (productMissing) hasMissingProduct = true;
                if (notEnoughStock) hasStockIssue = true;

                let warning = '';
                if (productMissing) {
                    warning = `<p class="text-[10px] text-red-600 mt-1 font-semibold"><i class="fas fa-exclamation-circle"></i> প্রোডাক্টটি আর পাওয়া যাচ্ছে না</p>`;
                } else if (notEnoughStock) {
                    warning = `<p class="text-[10px] text-red-500 mt-1"><i class="fas fa-exclamation-triangle"></i> স্টকে মাত্র ${stock} টি আছে</p>`;
                }

                html += `
                    <div class="bg-white rounded-2xl premium-shadow p-3 flex items-center gap-3 ${productMissing ? 'opacity-60' : ''}">
                        <img src="${item.image || 'https://via.placeholder.com/100x100?text=?'}" alt="${escapeHtml(item.name)}" class="w-20 h-20 object-contain rounded-xl bg-gray-50 flex-shrink-0" onerror="this.src='https://via.placeholder.com/100x100?text=?'">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-semibold navy-text line-clamp-2 mb-1">${escapeHtml(item.name)}</h4>
                            <p class="font-display text-base font-bold navy-text mb-2">৳ ${formatPrice(price)}</p>
                            ${warning}
                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 bg-cream rounded-lg flex items-center justify-center text-navy font-bold text-lg">−</button>
                                <span class="font-semibold text-sm w-8 text-center navy-text">${qty}</span>
                                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 bg-cream rounded-lg flex items-center justify-center text-navy font-bold text-lg ${(!productMissing && stock !== 999 && qty >= stock) ? 'opacity-40' : ''}" ${(!productMissing && stock !== 999 && qty >= stock) ? 'disabled' : ''}>+</button>
                                <button onclick="moveToWishlist(${index})" class="ml-1 text-[10px] text-gray-500 font-semibold px-2 py-1 rounded-lg bg-gray-50 hover:bg-gray-100">
                                    <i class="fas fa-heart text-red-400 mr-1"></i> Save
                                </button>
                            </div>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="font-bold navy-text mb-2 text-sm">৳ ${formatPrice(lineTotal)}</p>
                            <button onclick="removeItem(${index})" class="text-red-500 text-sm w-8 h-8 flex items-center justify-center ml-auto" aria-label="Remove">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>`;
            });

            cartItemsDiv.innerHTML = html;

            document.getElementById('cart-count-summary').textContent = cart.reduce((s, i) => s + (Number(i.quantity) || 0), 0);

            // Calculate discount
            let discount = 0;
            if (appliedCoupon && appliedCoupon.value > 0) {
                if (appliedCoupon.type === 'percentage') {
                    discount = Math.round((subtotal * appliedCoupon.value) / 100);
                } else {
                    discount = Math.min(appliedCoupon.value, subtotal);
                }
                // Min order check
                if (appliedCoupon.minOrder > 0 && subtotal < appliedCoupon.minOrder) {
                    discount = 0;
                }
            }
            if (discount < 0) discount = 0;
            if (discount > subtotal) discount = subtotal;

            const afterDiscount = subtotal - discount;
            const isFreeDelivery = settings.freeDeliveryAbove > 0 && afterDiscount >= settings.freeDeliveryAbove;
            const deliveryCharge = isFreeDelivery ? 0 : settings.deliveryCharge;
            const total = afterDiscount + deliveryCharge;

            document.getElementById('subtotal').innerText = '৳ ' + formatPrice(subtotal);

            // Discount row
            const discountRow = document.getElementById('discount-row');
            if (discount > 0) {
                discountRow.classList.remove('hidden');
                document.getElementById('discount-amount').innerText = '-৳ ' + formatPrice(discount);
            } else {
                discountRow.classList.add('hidden');
            }

            document.getElementById('delivery-charge').innerText = deliveryCharge === 0 ? 'ফ্রি' : '৳ ' + formatPrice(deliveryCharge);
            document.getElementById('total').innerText = '৳ ' + formatPrice(total);

            // Coupon UI sync
            updateCouponUI();

            // Free delivery note
            const freeNote = document.getElementById('free-delivery-note');
            const freeHint = document.getElementById('free-delivery-hint');

            if (isFreeDelivery) {
                freeNote.classList.remove('hidden');
                document.getElementById('free-delivery-amount').innerText = formatPrice(settings.freeDeliveryAbove);
                freeHint.classList.add('hidden');
            } else if (settings.freeDeliveryAbove > 0 && afterDiscount > 0) {
                const remaining = settings.freeDeliveryAbove - afterDiscount;
                if (remaining > 0) {
                    freeHint.classList.remove('hidden');
                    document.getElementById('free-delivery-hint-text').innerText = `আর ৳${formatPrice(remaining)} যোগ করলে ফ্রি ডেলিভারি পাবেন!`;
                } else {
                    freeHint.classList.add('hidden');
                }
                freeNote.classList.add('hidden');
            } else {
                freeNote.classList.add('hidden');
                freeHint.classList.add('hidden');
            }

            // Stock warning
            const stockWarnBox = document.getElementById('stock-warning-box');
            const stockWarnText = document.getElementById('stock-warning-text');
            const checkoutBtn = document.getElementById('checkout-btn');
            if (hasMissingProduct || hasStockIssue) {
                stockWarnBox.classList.remove('hidden');
                if (hasMissingProduct) stockWarnText.textContent = 'কিছু প্রোডাক্ট আর পাওয়া যাচ্ছে না। সেগুলো সরিয়ে ফেলুন।';
                else stockWarnText.textContent = 'কিছু প্রোডাক্টের স্টক কম। পরিমাণ ঠিক করুন।';
                checkoutBtn.disabled = true;
                checkoutBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                stockWarnBox.classList.add('hidden');
                checkoutBtn.disabled = false;
                checkoutBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // ============ COUPON ============
        function updateCouponUI() {
            const inputWrap = document.getElementById('coupon-input-wrap');
            const appliedBox = document.getElementById('coupon-applied');
            if (appliedCoupon && appliedCoupon.code) {
                inputWrap.classList.add('hidden');
                appliedBox.classList.remove('hidden');
                document.getElementById('coupon-applied-code').textContent = appliedCoupon.code;
                document.getElementById('coupon-applied-desc').textContent =
                    appliedCoupon.type === 'percentage'
                        ? `${appliedCoupon.value}% off`
                        : `৳${appliedCoupon.value} off`;
            } else {
                inputWrap.classList.remove('hidden');
                appliedBox.classList.add('hidden');
            }
            document.getElementById('coupon-error').classList.add('hidden');
        }

        window.applyCoupon = async function() {
            const input = document.getElementById('coupon-input');
            const code = (input.value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            const errEl = document.getElementById('coupon-error');
            errEl.classList.add('hidden');

            if (!code) {
                errEl.textContent = 'Coupon code দিন';
                errEl.classList.remove('hidden');
                return;
            }

            if (!db) {
                errEl.textContent = 'সার্ভার সংযোগ নেই';
                errEl.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('coupon-apply-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spin"></i>';

            try {
                const snap = await getDoc(doc(db, "coupons", code));
                if (!snap.exists()) {
                    errEl.textContent = 'এই coupon নেই';
                    errEl.classList.remove('hidden');
                    return;
                }
                const c = snap.data();
                if (c.active === false) {
                    errEl.textContent = 'Coupon টি active নেই';
                    errEl.classList.remove('hidden');
                    return;
                }
                if (c.expiry && new Date(c.expiry) < new Date()) {
                    errEl.textContent = 'Coupon টি expired';
                    errEl.classList.remove('hidden');
                    return;
                }
                if (c.maxUses > 0 && (c.usedCount || 0) >= c.maxUses) {
                    errEl.textContent = 'Coupon টি ব্যবহারের সীমা শেষ';
                    errEl.classList.remove('hidden');
                    return;
                }

                const cart = getCart();
                const subtotal = cart.reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.quantity) || 0), 0);
                if (c.minOrder > 0 && subtotal < c.minOrder) {
                    errEl.textContent = `এই coupon ব্যবহারে কমপক্ষে ৳${formatPrice(c.minOrder)} এর অর্ডার দরকার`;
                    errEl.classList.remove('hidden');
                    return;
                }

                appliedCoupon = {
                    code: snap.id,
                    type: c.type || 'percentage',
                    value: Number(c.value) || 0,
                    minOrder: Number(c.minOrder) || 0
                };
                try { localStorage.setItem('heartix_coupon', JSON.stringify(appliedCoupon)); } catch (e) {}
                showToast('Coupon applied!', 'success');
                input.value = '';
                renderCart();
            } catch (e) {
                console.error('Coupon error:', e);
                errEl.textContent = 'Coupon check করা যায়নি';
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Apply';
            }
        }

        window.removeCoupon = function() {
            appliedCoupon = null;
            try { localStorage.removeItem('heartix_coupon'); } catch (e) {}
            document.getElementById('coupon-input').value = '';
            showToast('Coupon removed', 'warn');
            renderCart();
        }

        // ============ ACTIONS ============
        window.proceedToCheckout = function() {
            const cart = getCart();
            for (const item of cart) {
                const stock = getStock(item.id);
                if (stock === null) {
                    showToast('কিছু প্রোডাক্ট আর নেই, কার্ট রিফ্রেশ করুন', 'error');
                    return;
                }
                if (stock !== 999 && item.quantity > stock) {
                    showToast(`"${item.name}" স্টকে মাত্র ${stock} টি`, 'error');
                    return;
                }
            }
            window.location.href = 'checkout.html';
        }

        window.changeQty = function(index, change) {
            let cart = getCart();
            if (!cart[index]) return;

            const productId = cart[index].id;
            const stock = getStock(productId);
            const newQty = (Number(cart[index].quantity) || 0) + change;

            if (newQty <= 0) {
                const name = cart[index].name || '';
                cart.splice(index, 1);
                saveCart(cart);
                renderCart();
                showToast(name.substring(0, 30) + ' কার্ট থেকে সরানো হয়েছে', 'warn');
                return;
            }

            if (stock !== null && stock !== 999 && newQty > stock) {
                showToast(`স্টকে মাত্র ${stock} টি আছে`, 'error');
                return;
            }

            cart[index].quantity = newQty;
            saveCart(cart);
            renderCart();
        };

        window.removeItem = function(index) {
            let cart = getCart();
            if (!cart[index]) return;
            const name = cart[index].name || '';
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            showToast(name.substring(0, 30) + ' সরানো হয়েছে', 'warn');
        };

        window.clearCart = function() {
            const cart = getCart();
            if (cart.length === 0) return;
            if (!confirm('আপনি কি পুরো কার্ট খালি করতে চান?')) return;
            saveCart([]);
            try { localStorage.removeItem('heartix_coupon'); } catch (e) {}
            appliedCoupon = null;
            renderCart();
            showToast('কার্ট খালি করা হয়েছে', 'warn');
        };

        // ⚡ NEW: Save for later (moves item to wishlist)
        window.moveToWishlist = function(index) {
            let cart = getCart();
            if (!cart[index]) return;
            const item = cart[index];
            let wl = getWishlist();
            if (!wl.includes(item.id)) {
                wl.push(item.id);
                saveWishlist(wl);
            }
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            showToast('Wishlist-এ সরানো হয়েছে', 'success');
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadData);
        } else {
            loadData();
        }
    </script>
</body>
</html>
