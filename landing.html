<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special Offer - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body class="pb-20">

    <div id="toast-container"></div>

    <!-- HEADER -->
    <header class="glass sticky top-0 z-30 px-3 py-2 flex justify-between items-center border-b border-gray-100">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-cream">
            <i class="fas fa-arrow-left text-navy text-lg"></i>
        </a>
        <img src="logo.png" alt="Heartix" class="h-10 object-contain">
        <a href="cart.html" class="relative w-10 h-10 flex items-center justify-center">
            <i class="fas fa-shopping-bag text-navy text-lg"></i>
            <span id="cart-count-header" class="absolute -top-1 -right-1 gold-gradient text-navy text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
    </header>

    <!-- LOADING -->
    <div id="loading-skeleton" class="p-4 max-w-3xl mx-auto">
        <div class="w-full h-56 shimmer rounded-2xl mb-4"></div>
        <div class="h-8 w-3/4 shimmer rounded mb-3"></div>
        <div class="h-5 w-1/2 shimmer rounded mb-6"></div>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white rounded-2xl p-2.5 premium-shadow">
                <div class="w-full h-32 shimmer rounded-lg mb-2"></div>
                <div class="h-3.5 w-3/4 shimmer rounded mb-2"></div>
                <div class="h-3.5 w-1/2 shimmer rounded mb-2"></div>
                <div class="h-8 w-full shimmer rounded-lg"></div>
            </div>
            <div class="bg-white rounded-2xl p-2.5 premium-shadow">
                <div class="w-full h-32 shimmer rounded-lg mb-2"></div>
                <div class="h-3.5 w-3/4 shimmer rounded mb-2"></div>
                <div class="h-3.5 w-1/2 shimmer rounded mb-2"></div>
                <div class="h-8 w-full shimmer rounded-lg"></div>
            </div>
        </div>
    </div>

    <!-- ERROR -->
    <div id="error-state" class="hidden p-4 max-w-3xl mx-auto">
        <div class="bg-white rounded-2xl p-12 text-center premium-shadow">
            <i class="fas fa-link-slash text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-600 font-semibold mb-2">এই offer page টি পাওয়া যায়নি</p>
            <p class="text-xs text-gray-400 mb-5">Link সঠিক কিনা চেক করুন</p>
            <a href="index.html" class="inline-block navy-gradient text-white px-6 py-3 rounded-xl text-sm font-semibold">
                <i class="fas fa-home mr-1"></i> হোমে ফিরুন
            </a>
        </div>
    </div>

    <!-- MAIN -->
    <div id="main-content" class="max-w-3xl mx-auto hidden">

        <!-- HERO BANNER -->
        <div id="hero-section" class="relative overflow-hidden"></div>

        <!-- COUNTDOWN -->
        <div id="countdown-section" class="hidden px-4 py-5 bg-red-50 border-y-2 border-red-200">
            <p class="text-center text-red-700 text-xs font-bold uppercase tracking-wider mb-2">
                <i class="fas fa-fire mr-1"></i> Offer শেষ হবে
            </p>
            <div id="countdown" class="flex justify-center gap-2"></div>
        </div>

        <!-- PRODUCTS -->
        <div class="p-4">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-1 h-5 bg-gold rounded-full"></span>
                    <h2 class="font-display text-xl font-bold text-navy">Special Offers</h2>
                </div>
                <span id="product-count" class="text-[11px] font-bold text-gray-500"></span>
            </div>
            <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
            <div id="empty-products" class="hidden text-center py-12">
                <i class="fas fa-box-open text-4xl text-gray-300 mb-3"></i>
                <p class="text-sm text-gray-500">এই offer-এ এখনো কোনো product নেই</p>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div id="description-section" class="hidden p-4 pt-0">
            <div class="bg-white rounded-2xl premium-shadow p-5">
                <h3 class="font-display text-base font-bold text-navy mb-2 flex items-center gap-2">
                    <i class="fas fa-info-circle gold-text text-sm"></i> বিস্তারিত
                </h3>
                <p id="description-text" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line"></p>
            </div>
        </div>

        <!-- CTA / HELP -->
        <div class="p-4 pt-0">
            <div class="bg-gradient-to-br from-[#0A1628] to-[#152238] rounded-2xl p-5 text-center">
                <div class="w-12 h-12 gold-gradient rounded-2xl mx-auto mb-3 flex items-center justify-center">
                    <i class="fas fa-headset text-navy text-lg"></i>
                </div>
                <p class="text-white font-semibold text-sm mb-1">সাহায্য দরকার?</p>
                <p class="text-white/60 text-xs mb-4">আমাদের সাথে যোগাযোগ করুন</p>
                <div class="grid grid-cols-2 gap-2 max-w-xs mx-auto">
                    <a id="whatsapp-cta" href="#" target="_blank" rel="noopener" class="bg-[#25D366] active:bg-[#1DA851] text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                    <a id="call-cta" href="#" class="bg-white/10 active:bg-white/20 text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fas fa-phone"></i> Call
                    </a>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="navy-gradient px-5 py-6 mt-6 text-center">
            <p class="text-white/50 text-[10px]">© 2025 Heartix. All rights reserved.</p>
        </footer>

    </div>

    <!-- FLOATING WHATSAPP ORDER -->
    <a id="floating-wa" href="#" target="_blank" rel="noopener" class="hidden fixed right-3 bottom-24 z-30 flex items-center gap-2 bg-[#25D366] text-white pl-2 pr-4 py-2 rounded-full shadow-lg shadow-[#25D366]/40 active:scale-95 transition-transform">
        <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
            <i class="fab fa-whatsapp text-lg"></i>
        </div>
        <div class="flex flex-col leading-tight">
            <span class="text-[9px] font-bold uppercase opacity-90">সহজে</span>
            <span class="text-xs font-extrabold">অর্ডার করুন</span>
        </div>
    </a>

    <!-- QUICK ORDER MODAL -->
    <div id="quick-order-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[90] flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-md animate-slide-up">
            <div class="navy-gradient p-5 rounded-t-3xl flex justify-between items-center">
                <div>
                    <h3 class="text-white font-bold text-base">Quick Order</h3>
                    <p class="text-gold text-[11px] mt-0.5">দ্রুত অর্ডার করুন</p>
                </div>
                <button onclick="closeQuickOrder()" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-5 space-y-3">
                <div id="quick-product-info" class="bg-gray-50 rounded-2xl p-4 flex items-center gap-3">
                    <!-- filled by JS -->
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">আপনার নাম *</label>
                    <input type="text" id="qo-name" placeholder="আপনার নাম" maxlength="60" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm focus:border-gold">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">ফোন নাম্বার *</label>
                    <input type="tel" id="qo-phone" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm focus:border-gold">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">ঠিকানা (Optional)</label>
                    <textarea id="qo-address" rows="2" placeholder="বাসা, রোড, এলাকা" maxlength="300" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none text-sm resize-none focus:border-gold"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="closeQuickOrder()" class="py-3.5 bg-gray-100 text-gray-700 rounded-xl font-bold text-sm">বাতিল</button>
                    <button onclick="sendQuickOrder('wa')" class="py-3.5 bg-[#25D366] text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/landing.js"></script>
</body>
</html>
