<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special Offer - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body class="pb-24">

    <div id="toast-container"></div>

    <header class="glass sticky top-0 z-30 px-3 py-2 flex justify-between items-center border-b border-gray-100">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-cream">
            <i class="fas fa-arrow-left text-navy text-lg"></i>
        </a>
        <img src="logo.png" alt="Heartix" class="h-10 object-contain">
        <a href="cart.html" class="relative w-10 h-10 flex items-center justify-center">
            <i class="fas fa-shopping-bag text-navy text-lg"></i>
            <span id="cart-count-header" class="absolute -top-1 -right-1 gold-gradient text-navy text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
    </header>

    <div id="loading-skeleton" class="p-4 max-w-3xl mx-auto">
        <div class="w-full h-64 shimmer rounded-2xl mb-4"></div>
        <div class="h-8 w-3/4 shimmer rounded mb-3"></div>
        <div class="h-40 w-full shimmer rounded-2xl mb-4"></div>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white rounded-2xl p-2.5 premium-shadow"><div class="w-full h-32 shimmer rounded-lg mb-2"></div><div class="h-3.5 w-3/4 shimmer rounded"></div></div>
            <div class="bg-white rounded-2xl p-2.5 premium-shadow"><div class="w-full h-32 shimmer rounded-lg mb-2"></div><div class="h-3.5 w-3/4 shimmer rounded"></div></div>
        </div>
    </div>

    <div id="error-state" class="hidden p-4 max-w-3xl mx-auto">
        <div class="bg-white rounded-2xl p-12 text-center premium-shadow">
            <i class="fas fa-link-slash text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-600 font-semibold mb-2">এই offer page টি পাওয়া যায়নি</p>
            <p class="text-xs text-gray-400 mb-5">Link সঠিক কিনা চেক করুন</p>
            <a href="index.html" class="inline-block navy-gradient text-white px-6 py-3 rounded-xl text-sm font-semibold">
                <i class="fas fa-home mr-1"></i> হোমে ফিরুন
            </a>
        </div>
    </div>

    <div id="main-content" class="max-w-3xl mx-auto hidden">

        <!-- HERO -->
        <div id="hero-section"></div>

        <!-- COUNTDOWN -->
        <div id="countdown-section" class="hidden">
            <div class="bg-gradient-to-r from-red-600 to-orange-500 text-white py-3 px-4">
                <div class="max-w-md mx-auto flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-fire text-lg animate-pulse"></i>
                        <span class="text-xs font-bold uppercase tracking-wider">Offer শেষ হবে</span>
                    </div>
                    <div id="countdown" class="flex items-center gap-1.5"></div>
                </div>
            </div>
        </div>

        <!-- PRODUCTS SECTION -->
        <div class="p-4">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-1 h-5 bg-gold rounded-full"></span>
                    <h2 class="font-display text-xl font-bold text-navy">Special Products</h2>
                </div>
                <span id="product-count" class="text-[11px] font-bold text-gray-500"></span>
            </div>
            <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
            <div id="empty-products" class="hidden text-center py-12">
                <i class="fas fa-box-open text-4xl text-gray-300 mb-3"></i>
                <p class="text-sm text-gray-500">এই offer-এ এখনো কোনো product নেই</p>
            </div>
        </div>

        <!-- ORDER FORM (INLINE - ALWAYS VISIBLE) -->
        <div id="order-form-section" class="p-4 pt-2">
            <div class="bg-white rounded-3xl premium-shadow-lg overflow-hidden">
                <!-- Form header -->
                <div class="navy-gradient p-5 text-center relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-16 -mt-16"></div>
                    <div class="absolute bottom-0 left-0 w-24 h-24 bg-gold/10 rounded-full -ml-12 -mb-12"></div>
                    <div class="relative">
                        <div class="w-14 h-14 gold-gradient rounded-2xl mx-auto mb-3 flex items-center justify-center shadow-lg">
                            <i class="fas fa-shopping-cart text-navy text-xl"></i>
                        </div>
                        <h3 class="font-display text-2xl text-white font-bold mb-1">অর্ডার করুন</h3>
                        <p class="text-gold text-xs">নিচের ফর্মটি পূরণ করুন</p>
                    </div>
                </div>

                <!-- Form body -->
                <div class="p-5 space-y-4">

                    <!-- Product selector -->
                    <div id="form-product-section">
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">
                            <i class="fas fa-box gold-text mr-1"></i> প্রোডাক্ট নির্বাচন করুন *
                        </label>
                        <div id="form-product-selector" class="space-y-2 max-h-56 overflow-y-auto p-2 border-2 border-gray-100 rounded-xl"></div>
                    </div>

                    <!-- Name -->
                    <div>
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">
                            <i class="fas fa-user gold-text mr-1"></i> আপনার নাম *
                        </label>
                        <input type="text" id="order-name" placeholder="আপনার পূর্ণ নাম" maxlength="60"
                            class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm font-medium focus:border-gold transition">
                    </div>

                    <!-- Phone -->
                    <div>
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">
                            <i class="fas fa-phone gold-text mr-1"></i> মোবাইল নাম্বার *
                        </label>
                        <input type="tel" id="order-phone" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric"
                            class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm font-medium focus:border-gold transition">
                    </div>

                    <!-- Address -->
                    <div>
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">
                            <i class="fas fa-map-marker-alt gold-text mr-1"></i> সম্পূর্ণ ঠিকানা *
                        </label>
                        <textarea id="order-address" rows="2" placeholder="বাসা নম্বর, রোড, এলাকা, থানা, জেলা" maxlength="300"
                            class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm font-medium resize-none focus:border-gold transition"></textarea>
                    </div>

                    <!-- Submit WhatsApp -->
                    <button onclick="submitOrder()" id="submit-order-btn"
                        class="w-full bg-[#25D366] active:bg-[#1DA851] text-white font-bold py-4 rounded-2xl text-base shadow-lg shadow-[#25D366]/30 flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
                        <i class="fab fa-whatsapp text-2xl"></i>
                        <span>WhatsApp-এ অর্ডার কনফার্ম করুন</span>
                    </button>

                    <!-- Or call -->
                    <div class="flex items-center gap-3">
                        <div class="flex-1 h-px bg-gray-200"></div>
                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">অথবা</span>
                        <div class="flex-1 h-px bg-gray-200"></div>
                    </div>

                    <a id="call-order-btn" href="#" class="w-full bg-navy active:bg-navy-dark text-white font-bold py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2 transition">
                        <i class="fas fa-phone-alt"></i>
                        <span>ফোনে অর্ডার করুন</span>
                    </a>

                    <p class="text-[10px] text-gray-400 text-center leading-relaxed pt-1">
                        <i class="fas fa-shield-alt text-green-500 mr-1"></i>
                        আপনার তথ্য নিরাপদ। অর্ডার কনফার্ম করতে আমরা কল দেব।
                    </p>
                </div>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div id="description-section" class="hidden p-4 pt-0">
            <div class="bg-white rounded-2xl premium-shadow p-5">
                <h3 class="font-display text-base font-bold text-navy mb-2 flex items-center gap-2">
                    <i class="fas fa-info-circle gold-text text-sm"></i> বিস্তারিত
                </h3>
                <p id="description-text" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line"></p>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="navy-gradient px-5 py-6 mt-6 text-center">
            <p class="text-white/50 text-[10px]">© 2025 Heartix. All rights reserved.</p>
        </footer>

    </div>

    <script type="module" src="js/landing.js"></script>
</body>
</html>
