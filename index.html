<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartix - Smart Appliances</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .brand-navy { color: #0B1B3D; }
        .brand-bg-navy { background-color: #0B1B3D; }
    </style>
</head>
<body class="bg-gray-50 pb-20 font-sans">

    <header class="bg-white sticky top-0 z-50 shadow-sm p-4 flex justify-between items-center">
        <i class="fas fa-bars text-xl text-gray-700"></i>
        <img src="logo.png" alt="Heartix" class="h-10 object-contain">
        <a href="cart.html" class="relative">
            <i class="fas fa-shopping-cart text-xl text-gray-700"></i>
            <span id="cart-count-header" class="absolute -top-2 -right-2 brand-bg-navy text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
    </header>

    <div class="p-4 bg-white">
        <div class="relative">
            <input type="text" placeholder="Search for products..." class="w-full bg-gray-100 rounded-lg py-2 px-4 outline-none focus:ring-2 focus:ring-[#0B1B3D]">
            <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
        </div>
    </div>

    <div class="px-4 mt-2">
        <div class="brand-bg-navy rounded-xl p-8 text-center text-white shadow-md">
            <h2 class="text-2xl font-bold mb-2">Welcome to Heartix</h2>
            <p class="text-sm opacity-90">Smart Appliances for Smart Living</p>
        </div>
    </div>

    <div class="mt-6 px-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">Featured Categories</h3>
        <div class="flex overflow-x-auto hide-scrollbar gap-4 pb-2">
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">📺</div>
                <span class="text-xs mt-2 text-gray-600">TV</span>
            </div>
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">❄️</div>
                <span class="text-xs mt-2 text-gray-600">Fridge</span>
            </div>
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">🌀</div>
                <span class="text-xs mt-2 text-gray-600">Fan</span>
            </div>
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">🔌</div>
                <span class="text-xs mt-2 text-gray-600">Gadgets</span>
            </div>
        </div>
    </div>

    <div class="mt-6 px-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-3 text-center">Top Selling Products</h3>
        <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <p class="col-span-full text-center text-gray-500">Loading products...</p>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around py-2 z-50 md:hidden">
        <a href="index.html" class="flex flex-col items-center brand-navy">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] mt-1">HOME</span>
        </a>
        <div class="flex flex-col items-center text-gray-500">
            <i class="fas fa-th-large text-lg"></i>
            <span class="text-[10px] mt-1">MENU</span>
        </div>
        <a href="cart.html" class="flex flex-col items-center text-gray-500 relative">
            <i class="fas fa-shopping-bag text-lg"></i>
            <span id="cart-count-bottom" class="absolute -top-1 -right-1 brand-bg-navy text-white text-[8px] rounded-full h-4 w-4 flex items-center justify-center">0</span>
            <span class="text-[10px] mt-1">CART</span>
        </a>
        <div class="flex flex-col items-center text-gray-500">
            <i class="fas fa-search text-lg"></i>
            <span class="text-[10px] mt-1">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-gray-500">
            <i class="fas fa-user text-lg"></i>
            <span class="text-[10px] mt-1">ACCOUNT</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJMggVKtyP6c9qtb7rYE_3jh01l4me4w",
            authDomain: "heartix.firebaseapp.com",
            projectId: "heartix",
            storageBucket: "heartix.firebasestorage.app",
            messagingSenderId: "551204402338",
            appId: "1:551204402338:web:169555975c0bbb97f113fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // গ্লোবাল প্রোডাক্ট ডাটা স্টোর
        let allProducts = {};

        function getCart() {
            const cart = localStorage.getItem('heartix_cart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('heartix_cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            const cart = getCart();
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count-header').innerText = totalItems;
            const bottomCount = document.getElementById('cart-count-bottom');
            if (bottomCount) bottomCount.innerText = totalItems;
        }

        // শুধুমাত্র ID দিয়ে কার্টে অ্যাড করার ফাংশন (কোটেশন সমস্যা সমাধানের জন্য)
        window.addToCart = function(id) {
            const product = allProducts[id];
            if (!product) {
                alert("প্রোডাক্টটি খুঁজে পাওয়া যায়নি!");
                return;
            }

            let cart = getCart();
            const existingIndex = cart.findIndex(item => item.id === id);
            
            if (existingIndex > -1) {
                cart[existingIndex].quantity++;
            } else {
                cart.push({ 
                    id: id, 
                    name: product.name, 
                    price: product.price, 
                    image: product.image, 
                    quantity: 1 
                });
            }
            
            saveCart(cart);
            updateCartCount();
            alert(product.name + " কার্টে অ্যাড করা হয়েছে!");
        }

        async function loadProducts() {
            const productListDiv = document.getElementById('product-list');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                let htmlContent = '';
                
                if (querySnapshot.empty) {
                    productListDiv.innerHTML = '<p class="col-span-full text-center text-gray-500">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    const productId = doc.id;
                    
                    // প্রোডাক্টটি গ্লোবাল অবজেক্টে সেভ করা হচ্ছে
                    allProducts[productId] = product;

                    htmlContent += `
                        <div class="bg-white rounded-lg shadow-sm p-3 flex flex-col relative">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-32 object-cover rounded mb-2">
                            <h4 class="text-sm font-medium text-gray-800">${product.name}</h4>
                            <p class="brand-navy font-bold mt-1">৳ ${product.price}</p>
                            <button onclick="addToCart('${productId}')" class="mt-3 w-full brand-bg-navy text-white text-sm py-1.5 rounded hover:opacity-90 transition">Add To Cart</button>
                        </div>
                    `;
                });
                
                productListDiv.innerHTML = htmlContent;
            } catch (error) {
                productListDiv.innerHTML = `<p class="col-span-full text-center text-red-500">Error: ${error.message}</p>`;
            }
        }

        updateCartCount();
        loadProducts();
    </script>
</body>
</html>
