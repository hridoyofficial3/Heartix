<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartix - Smart Appliances</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .brand-navy { color: #0B1B3D; }
        .brand-bg-navy { background-color: #0B1B3D; }
        .brand-green { color: #7E9E7E; }
        .brand-bg-green { background-color: #7E9E7E; }
        .brand-peach { color: #F9C287; }
        .brand-bg-peach { background-color: #F9C287; }
    </style>
</head>
<body class="bg-gray-50 pb-20 font-sans">

    <!-- হেডার -->
    <header class="bg-white sticky top-0 z-50 shadow-sm p-4 flex justify-between items-center">
        <i class="fas fa-bars text-xl text-gray-700"></i>
        <img src="logo.png" alt="Heartix" class="h-10 object-contain">
        <div class="relative">
            <i class="fas fa-shopping-cart text-xl text-gray-700"></i>
            <span class="cart-count-badge absolute -top-2 -right-2 brand-bg-navy text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </div>
    </header>

    <!-- সার্চ বার -->
    <div class="p-4 bg-white">
        <div class="relative">
            <input type="text" placeholder="Search for products..." class="w-full bg-gray-100 rounded-lg py-2 px-4 outline-none focus:ring-2 focus:ring-[#0B1B3D]">
            <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
        </div>
    </div>

    <!-- ব্যানার -->
    <div class="px-4 mt-2">
        <div class="brand-bg-navy rounded-xl p-8 text-center text-white shadow-md">
            <h2 class="text-2xl font-bold mb-2">Welcome to Heartix</h2>
            <p class="text-sm opacity-90">Smart Appliances for Smart Living</p>
        </div>
    </div>

    <!-- ফিচার্ড ক্যাটাগরি -->
    <div class="mt-6 px-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">Featured Categories</h3>
        <div class="flex overflow-x-auto hide-scrollbar gap-4 pb-2">
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">📺</div>
                <span class="text-xs mt-2 text-gray-600">TV</span>
            </div>
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">❄️</div>
                <span class="text-xs mt-2 text-gray-600">Fridge</span>
            </div>
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">🌀</div>
                <span class="text-xs mt-2 text-gray-600">Fan</span>
            </div>
            <div class="flex flex-col items-center min-w-[80px]">
                <div class="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl">🔌</div>
                <span class="text-xs mt-2 text-gray-600">Gadgets</span>
            </div>
        </div>
    </div>

    <!-- টপ সেলিং প্রোডাক্ট -->
    <div class="mt-6 px-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-3 text-center">Top Selling Products</h3>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- প্রোডাক্ট কার্ড ১ -->
            <div class="bg-white rounded-lg shadow-sm p-3 flex flex-col relative">
                <span class="absolute top-2 left-2 brand-bg-navy text-white text-[10px] px-2 py-1 rounded">Best Selling</span>
                <img src="https://via.placeholder.com/150" alt="Product" class="w-full h-32 object-cover rounded mb-2">
                <h4 class="text-sm font-medium text-gray-800">Smart LED TV 32"</h4>
                <p class="brand-navy font-bold mt-1">৳ ২৫,০০০</p>
                <button onclick="addToCart()" class="mt-3 w-full brand-bg-navy text-white text-sm py-1.5 rounded hover:opacity-90 transition">Add To Cart</button>
            </div>

            <!-- প্রোডাক্ট কার্ড ২ -->
            <div class="bg-white rounded-lg shadow-sm p-3 flex flex-col relative">
                <img src="https://via.placeholder.com/150" alt="Product" class="w-full h-32 object-cover rounded mb-2">
                <h4 class="text-sm font-medium text-gray-800">Smart Refrigerator</h4>
                <p class="brand-navy font-bold mt-1">৳ ৪৫,০০০</p>
                <button onclick="addToCart()" class="mt-3 w-full brand-bg-navy text-white text-sm py-1.5 rounded hover:opacity-90 transition">Add To Cart</button>
            </div>

            <!-- প্রোডাক্ট কার্ড ৩ -->
            <div class="bg-white rounded-lg shadow-sm p-3 flex flex-col relative">
                <img src="https://via.placeholder.com/150" alt="Product" class="w-full h-32 object-cover rounded mb-2">
                <h4 class="text-sm font-medium text-gray-800">Ceiling Fan</h4>
                <p class="brand-navy font-bold mt-1">৳ ৩,৫০০</p>
                <button onclick="addToCart()" class="mt-3 w-full brand-bg-navy text-white text-sm py-1.5 rounded hover:opacity-90 transition">Add To Cart</button>
            </div>

            <!-- প্রোডাক্ট কার্ড ৪ -->
            <div class="bg-white rounded-lg shadow-sm p-3 flex flex-col relative">
                <img src="https://via.placeholder.com/150" alt="Product" class="w-full h-32 object-cover rounded mb-2">
                <h4 class="text-sm font-medium text-gray-800">Smart Watch</h4>
                <p class="brand-navy font-bold mt-1">৳ ২,৫০০</p>
                <button onclick="addToCart()" class="mt-3 w-full brand-bg-navy text-white text-sm py-1.5 rounded hover:opacity-90 transition">Add To Cart</button>
            </div>
        </div>
    </div>

    <!-- মোবাইলের জন্য বটম নেভিগেশন বার -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around py-2 z-50 md:hidden">
        <div class="flex flex-col items-center brand-navy">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] mt-1">HOME</span>
        </div>
        <div class="flex flex-col items-center text-gray-500">
            <i class="fas fa-th-large text-lg"></i>
            <span class="text-[10px] mt-1">MENU</span>
        </div>
        <div class="flex flex-col items-center text-gray-500 relative">
            <i class="fas fa-shopping-bag text-lg"></i>
            <span class="cart-count-badge absolute -top-1 -right-1 brand-bg-navy text-white text-[8px] rounded-full h-4 w-4 flex items-center justify-center">0</span>
            <span class="text-[10px] mt-1">CART</span>
        </div>
        <div class="flex flex-col items-center text-gray-500">
            <i class="fas fa-search text-lg"></i>
            <span class="text-[10px] mt-1">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-gray-500">
            <i class="fas fa-user text-lg"></i>
            <span class="text-[10px] mt-1">ACCOUNT</span>
        </div>
    </div>

    <!-- কার্টের বেসিক জাভাস্ক্রিপ্ট -->
    <script>
        let cartCount = 0;
        function addToCart() {
            cartCount++;
            // সব কার্ট ব্যাজ আপডেট করুন
            document.querySelectorAll('.cart-count-badge').forEach(el => {
                el.innerText = cartCount;
            });
            alert("প্রোডাক্ট কার্টে অ্যাড করা হয়েছে!");
        }
    </script>

    <!-- ফায়ারবেস কানেকশন -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

            authDomain: "heartix.firebaseapp.com",
            projectId: "heartix",
            storageBucket: "heartix.firebasestorage.app",
            messagingSenderId: "551204402338",
            appId: "1:551204402338:web:169555975c0bbb97f113fb"
        };

        const app = initializeApp(firebaseConfig);
        console.log("Firebase সফলভাবে কানেক্ট হয়েছে!");
    </script>

</body>
              </html>
