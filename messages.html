<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages - Heartix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' } },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body class="pb-20 md:pb-6">

    <div id="toast-container"></div>

    <!-- LOADING -->
    <div id="loading-section" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl gold-gradient flex items-center justify-center animate-pulse">
                <i class="fas fa-envelope text-navy text-2xl"></i>
            </div>
            <p class="text-gray-400 text-sm font-medium">Loading messages...</p>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="login-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-6">
                <div class="w-20 h-20 mx-auto mb-4 rounded-3xl navy-gradient flex items-center justify-center shadow-2xl">
                    <i class="fas fa-envelope text-gold text-3xl"></i>
                </div>
                <h1 class="font-display text-3xl text-navy font-bold mb-1">Messages</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Admin Panel</p>
            </div>
            <div class="bg-white rounded-3xl premium-shadow p-6">
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Email</label>
                    <input type="email" id="admin-email" placeholder="admin@heartix.com" autocomplete="username" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm">
                </div>
                <div class="mb-5">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm">
                </div>
                <button onclick="login()" id="login-btn" class="navy-gradient text-white w-full py-4 rounded-xl font-bold text-sm">
                    <i class="fas fa-sign-in-alt mr-2"></i> SIGN IN
                </button>
                <p id="login-error" class="text-red-500 text-xs text-center mt-3 hidden font-medium"></p>
                <a href="admin.html" class="block text-center text-gray-500 text-xs mt-4">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Admin
                </a>
            </div>
        </div>
    </div>

    <!-- NOT ADMIN -->
    <div id="not-admin-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl premium-shadow w-full max-w-sm text-center">
            <i class="fas fa-shield-halved text-red-500 text-4xl mb-3"></i>
            <h2 class="font-display text-2xl font-bold text-navy mb-2">Access Denied</h2>
            <p class="text-sm text-gray-500 mb-6">এই অ্যাকাউন্টটি অ্যাডমিন নয়।</p>
            <button onclick="logout()" class="navy-gradient text-white w-full py-3 rounded-xl font-bold text-sm">
                <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </button>
        </div>
    </div>

    <!-- MESSAGES -->
    <div id="messages-section" class="hidden min-h-screen">

        <header class="glass sticky top-0 z-30 px-4 py-3 flex justify-between items-center border-b border-gray-100">
            <a href="admin.html" class="flex items-center gap-2 text-navy">
                <i class="fas fa-arrow-left"></i>
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center">
                        <i class="fas fa-envelope text-navy text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-navy font-display font-bold text-base leading-none">Messages</h1>
                        <p class="text-gold text-[9px] uppercase font-bold tracking-widest mt-0.5" id="unread-count-text">0 unread</p>
                    </div>
                </div>
            </a>
            <div class="flex items-center gap-2">
                <button onclick="loadMessages()" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-navy" title="Refresh">
                    <i class="fas fa-sync-alt text-sm"></i>
                </button>
                <button onclick="logout()" class="w-9 h-9 rounded-full bg-red-50 flex items-center justify-center text-red-500" title="Logout">
                    <i class="fas fa-sign-out-alt text-sm"></i>
                </button>
            </div>
        </header>

        <main class="p-4 max-w-2xl mx-auto">

            <!-- FILTERS -->
            <div class="flex gap-2 mb-4">
                <button onclick="filterMessages('all')" id="filter-all" class="filter-btn flex-1 py-2 rounded-xl text-xs font-bold bg-navy text-white">All</button>
                <button onclick="filterMessages('unread')" id="filter-unread" class="filter-btn flex-1 py-2 rounded-xl text-xs font-bold bg-white text-gray-600">Unread</button>
                <button onclick="filterMessages('read')" id="filter-read" class="filter-btn flex-1 py-2 rounded-xl text-xs font-bold bg-white text-gray-600">Read</button>
            </div>

            <div id="messages-list" class="space-y-3"></div>

            <div id="empty-state" class="hidden bg-white rounded-2xl p-12 text-center premium-shadow">
                <i class="fas fa-inbox text-5xl text-gray-200 mb-3"></i>
                <p class="text-sm text-gray-500 mb-1">কোনো message নেই</p>
                <p class="text-xs text-gray-400">Contact form থেকে message আসলে এখানে দেখাবে</p>
            </div>

        </main>

        <!-- ============ MOBILE BOTTOM NAV (NEW) ============ -->
        <nav class="mobile-bottom-nav fixed bottom-0 left-0 right-0 z-30 md:hidden bg-white border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
            <div class="flex justify-around items-center py-1.5">
                <a href="admin.html" class="mob-nav-btn flex flex-col items-center py-2 px-2 min-w-[56px] text-gray-400">
                    <i class="fas fa-chart-pie text-lg"></i><span class="text-[9px] mt-1 font-semibold">Home</span>
                </a>
                <a href="admin.html" onclick="sessionStorage.setItem('adminTab','orders')" class="mob-nav-btn flex flex-col items-center py-2 px-2 min-w-[56px] text-gray-400 relative">
                    <i class="fas fa-receipt text-lg"></i><span class="text-[9px] mt-1 font-semibold">Orders</span>
                </a>
                <a href="messages.html" class="mob-nav-btn flex flex-col items-center py-2 px-2 min-w-[56px] text-gold relative">
                    <i class="fas fa-envelope text-lg"></i><span class="text-[9px] mt-1 font-semibold">Messages</span>
                    <span id="messages-badge-mob" class="absolute top-0 right-1 bg-red-500 text-white text-[9px] font-bold rounded-full h-4 min-w-[16px] px-1 flex items-center justify-center hidden">0</span>
                </a>
                <a href="admin.html" onclick="sessionStorage.setItem('adminTab','products')" class="mob-nav-btn flex flex-col items-center py-2 px-2 min-w-[56px] text-gray-400">
                    <i class="fas fa-box text-lg"></i><span class="text-[9px] mt-1 font-semibold">Products</span>
                </a>
                <a href="admin.html" onclick="sessionStorage.setItem('adminTab','more')" class="mob-nav-btn flex flex-col items-center py-2 px-2 min-w-[56px] text-gray-400">
                    <i class="fas fa-ellipsis-h text-lg"></i><span class="text-[9px] mt-1 font-semibold">More</span>
                </a>
            </div>
        </nav>

    </div>

    <!-- MESSAGE DETAIL MODAL -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-lg max-h-[92vh] overflow-y-auto animate-slide-up">
            <div class="navy-gradient p-5 rounded-t-3xl flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h3 class="text-white font-bold text-lg">Message Details</h3>
                    <p id="dm-date" class="text-gold text-[11px] mt-0.5"></p>
                </div>
                <button onclick="closeDetail()" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div class="bg-gray-50 rounded-2xl p-4">
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">From</p>
                    <p id="dm-name" class="text-sm font-bold text-navy"></p>
                    <p id="dm-contact" class="text-xs text-gray-600 mt-0.5"></p>
                    <p id="dm-subject" class="text-[11px] text-gray-500 mt-2"></p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Message</p>
                    <p id="dm-message" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 rounded-2xl p-4"></p>
                </div>
                <div class="space-y-2">
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Reply via</p>
                    <div class="grid grid-cols-2 gap-2">
                        <a id="dm-call-btn" href="#" class="py-3 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center gap-2 text-xs font-bold">
                            <i class="fas fa-phone"></i> Call
                        </a>
                        <a id="dm-wa-btn" href="#" target="_blank" rel="noopener" class="py-3 bg-green-50 text-green-700 rounded-xl flex items-center justify-center gap-2 text-xs font-bold">
                            <i class="fab fa-whatsapp"></i> WhatsApp
                        </a>
                    </div>
                    <a id="dm-email-btn" href="#" class="block py-3 bg-purple-50 text-purple-700 rounded-xl flex items-center justify-center gap-2 text-xs font-bold">
                        <i class="fas fa-envelope"></i> Email Reply
                    </a>
                </div>
                <button onclick="deleteCurrentMessage()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold text-xs">
                    <i class="fas fa-trash mr-1"></i> Delete Message
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/messages.js"></script>
</body>
</html>
