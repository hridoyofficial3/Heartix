<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages - Heartix Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' } },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #F5F5F7; }
        .font-display { font-family: 'Playfair Display', serif; }
        .navy-gradient { background: linear-gradient(135deg, #0A1628 0%, #152238 100%); }
        .gold-gradient { background: linear-gradient(135deg, #D4A84B 0%, #E8C77B 50%, #D4A84B 100%); }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); }
        .premium-shadow { box-shadow: 0 4px 20px rgba(10,22,40,0.06); }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .toast { min-width: 260px; max-width: 90vw; padding: 14px 20px; border-radius: 14px; color: white; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); animation: slideDown 0.35s ease-out; }
        .toast-success { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .toast-warn { background: linear-gradient(135deg, #ea580c, #f97316); }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        input:focus { border-color: #D4A84B !important; }
        .msg-card { transition: all 0.15s ease; }
        .msg-card:active { transform: scale(0.99); }
        .unread-dot { width: 8px; height: 8px; background: #dc2626; border-radius: 50%; }
    </style>
</head>
<body class="pb-8">

    <div id="toast-container"></div>

    <!-- LOADING -->
    <div id="loading-section" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl gold-gradient flex items-center justify-center animate-pulse">
                <i class="fas fa-envelope text-navy text-2xl"></i>
            </div>
            <p class="text-gray-400 text-sm font-medium">Loading messages...</p>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="login-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-6">
                <div class="w-20 h-20 mx-auto mb-4 rounded-3xl navy-gradient flex items-center justify-center shadow-2xl">
                    <i class="fas fa-envelope text-gold text-3xl"></i>
                </div>
                <h1 class="font-display text-3xl text-navy font-bold mb-1">Messages</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Admin Panel</p>
            </div>
            <div class="bg-white rounded-3xl premium-shadow p-6">
                <div class="mb-3">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Email</label>
                    <input type="email" id="admin-email" placeholder="admin@heartix.com" autocomplete="username" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm">
                </div>
                <div class="mb-5">
                    <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3.5 outline-none text-sm">
                </div>
                <button onclick="login()" id="login-btn" class="navy-gradient text-white w-full py-4 rounded-xl font-bold text-sm">
                    <i class="fas fa-sign-in-alt mr-2"></i> SIGN IN
                </button>
                <p id="login-error" class="text-red-500 text-xs text-center mt-3 hidden font-medium"></p>
                <a href="admin.html" class="block text-center text-gray-500 text-xs mt-4">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Admin
                </a>
            </div>
        </div>
    </div>

    <!-- NOT ADMIN -->
    <div id="not-admin-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl premium-shadow w-full max-w-sm text-center">
            <i class="fas fa-shield-halved text-red-500 text-4xl mb-3"></i>
            <h2 class="font-display text-2xl font-bold text-navy mb-2">Access Denied</h2>
            <p class="text-sm text-gray-500 mb-6">এই অ্যাকাউন্টটি অ্যাডমিন নয়।</p>
            <button onclick="logout()" class="navy-gradient text-white w-full py-3 rounded-xl font-bold text-sm">
                <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </button>
        </div>
    </div>

    <!-- MESSAGES -->
    <div id="messages-section" class="hidden min-h-screen">

        <header class="glass sticky top-0 z-30 px-4 py-3 flex justify-between items-center border-b border-gray-100">
            <a href="admin.html" class="flex items-center gap-2 text-navy">
                <i class="fas fa-arrow-left"></i>
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center">
                        <i class="fas fa-envelope text-navy text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-navy font-display font-bold text-base leading-none">Messages</h1>
                        <p class="text-gold text-[9px] uppercase font-bold tracking-widest mt-0.5" id="unread-count-text">0 unread</p>
                    </div>
                </div>
            </a>
            <div class="flex items-center gap-2">
                <button onclick="loadMessages()" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-navy" title="Refresh">
                    <i class="fas fa-sync-alt text-sm"></i>
                </button>
                <button onclick="logout()" class="w-9 h-9 rounded-full bg-red-50 flex items-center justify-center text-red-500" title="Logout">
                    <i class="fas fa-sign-out-alt text-sm"></i>
                </button>
            </div>
        </header>

        <main class="p-4 max-w-2xl mx-auto">

            <!-- FILTERS -->
            <div class="flex gap-2 mb-4">
                <button onclick="filterMessages('all')" id="filter-all" class="filter-btn flex-1 py-2 rounded-xl text-xs font-bold bg-navy text-white">All</button>
                <button onclick="filterMessages('unread')" id="filter-unread" class="filter-btn flex-1 py-2 rounded-xl text-xs font-bold bg-white text-gray-600">Unread</button>
                <button onclick="filterMessages('read')" id="filter-read" class="filter-btn flex-1 py-2 rounded-xl text-xs font-bold bg-white text-gray-600">Read</button>
            </div>

            <div id="messages-list" class="space-y-3"></div>

            <div id="empty-state" class="hidden bg-white rounded-2xl p-12 text-center premium-shadow">
                <i class="fas fa-inbox text-5xl text-gray-200 mb-3"></i>
                <p class="text-sm text-gray-500 mb-1">কোনো message নেই</p>
                <p class="text-xs text-gray-400">Contact form থেকে message আসলে এখানে দেখাবে</p>
            </div>

        </main>

    </div>

    <!-- MESSAGE DETAIL MODAL -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-white rounded-t-3xl md:rounded-3xl w-full max-w-lg max-h-[92vh] overflow-y-auto animate-slide-up">
            <div class="navy-gradient p-5 rounded-t-3xl flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h3 class="text-white font-bold text-lg">Message Details</h3>
                    <p id="dm-date" class="text-gold text-[11px] mt-0.5"></p>
                </div>
                <button onclick="closeDetail()" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div class="bg-gray-50 rounded-2xl p-4">
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">From</p>
                    <p id="dm-name" class="text-sm font-bold text-navy"></p>
                    <p id="dm-contact" class="text-xs text-gray-600 mt-0.5"></p>
                    <p id="dm-subject" class="text-[11px] text-gray-500 mt-2"></p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Message</p>
                    <p id="dm-message" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 rounded-2xl p-4"></p>
                </div>
                <div class="space-y-2">
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Reply via</p>
                    <div class="grid grid-cols-2 gap-2">
                        <a id="dm-call-btn" href="#" class="py-3 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center gap-2 text-xs font-bold">
                            <i class="fas fa-phone"></i> Call
                        </a>
                        <a id="dm-wa-btn" href="#" target="_blank" rel="noopener" class="py-3 bg-green-50 text-green-700 rounded-xl flex items-center justify-center gap-2 text-xs font-bold">
                            <i class="fab fa-whatsapp"></i> WhatsApp
                        </a>
                    </div>
                    <a id="dm-email-btn" href="#" class="block py-3 bg-purple-50 text-purple-700 rounded-xl flex items-center justify-center gap-2 text-xs font-bold">
                        <i class="fas fa-envelope"></i> Email Reply
                    </a>
                </div>
                <button onclick="deleteCurrentMessage()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold text-xs">
                    <i class="fas fa-trash mr-1"></i> Delete Message
                </button>
            </div>
        </div>
    </div>

    <script>
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </script>
    <style>
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJMggVKtyP6c9qtb7rYE_3jh01l4me4w",
            authDomain: "heartix.firebaseapp.com",
            projectId: "heartix",
            storageBucket: "heartix.firebasestorage.app",
            messagingSenderId: "551204402338",
            appId: "1:551204402338:web:169555975c0bbb97f113fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allMessages = [];
        let currentFilter = 'all';
        let currentMessageId = null;
        let currentMessage = null;

        function toast(msg, type) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast toast-' + type;
            const icons = { success: 'check-circle', error: 'times-circle', warn: 'exclamation-triangle' };
            t.innerHTML = `<i class="fas fa-${icons[type] || 'info-circle'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(t);
            setTimeout(() => { t.style.transition = 'all 0.3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }

        function showSection(id) {
            ['loading-section', 'login-section', 'not-admin-section', 'messages-section'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        async function verifyAdmin(uid) {
            try {
                const snap = await getDoc(doc(db, "settings", "admins"));
                if (snap.exists()) {
                    const uids = snap.data().uids || [];
                    return Array.isArray(uids) && uids.includes(uid);
                }
            } catch (e) {}
            return false;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const ok = await verifyAdmin(user.uid);
                if (ok) {
                    showSection('messages-section');
                    loadMessages();
                } else {
                    await signOut(auth);
                    showSection('not-admin-section');
                }
            } else {
                showSection('login-section');
            }
        });

        window.login = async function() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');
            if (!email || !password) { errEl.textContent = 'ইমেইল ও পাসওয়ার্ড দিন'; errEl.classList.remove('hidden'); return; }
            const btn = document.getElementById('login-btn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Signing in...';
            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('admin-password').value = '';
            } catch (e) {
                let msg = 'লগইন ব্যর্থ';
                if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'ইমেইল বা পাসওয়ার্ড ভুল';
                errEl.textContent = msg;
                errEl.classList.remove('hidden');
            } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> SIGN IN'; }
        };

        window.logout = async function() {
            try { await signOut(auth); } catch (e) {}
            location.reload();
        };

        async function loadMessages() {
            try {
                const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                allMessages = [];
                snap.forEach(d => allMessages.push({ id: d.id, ...d.data() }));
            } catch (e) {
                // Fallback without orderBy
                try {
                    const snap = await getDocs(collection(db, "messages"));
                    allMessages = [];
                    snap.forEach(d => allMessages.push({ id: d.id, ...d.data() }));
                    allMessages.sort((a, b) => {
                        const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                        const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                        return tb - ta;
                    });
                } catch (e2) { console.error(e2); }
            }
            const unread = allMessages.filter(m => !m.read).length;
            document.getElementById('unread-count-text').textContent = unread + ' unread';
            renderMessages();
        }
        window.loadMessages = loadMessages;

        window.filterMessages = function(filter) {
            currentFilter = filter;
            ['all', 'unread', 'read'].forEach(f => {
                const btn = document.getElementById('filter-' + f);
                if (f === filter) {
                    btn.classList.remove('bg-white', 'text-gray-600');
                    btn.classList.add('bg-navy', 'text-white');
                } else {
                    btn.classList.add('bg-white', 'text-gray-600');
                    btn.classList.remove('bg-navy', 'text-white');
                }
            });
            renderMessages();
        };

        function renderMessages() {
            const list = document.getElementById('messages-list');
            const empty = document.getElementById('empty-state');
            let filtered = allMessages;
            if (currentFilter === 'unread') filtered = filtered.filter(m => !m.read);
            if (currentFilter === 'read') filtered = filtered.filter(m => m.read);

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            let html = '';
            filtered.forEach(m => {
                const date = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
                const unreadCls = !m.read ? 'border-l-4 border-gold bg-yellow-50/40' : 'border-l-4 border-gray-200';
                html += `<div onclick="openDetail('${m.id}')" class="msg-card bg-white rounded-2xl p-4 premium-shadow ${unreadCls} cursor-pointer">
                    <div class="flex justify-between items-start mb-2 gap-2">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                                ${!m.read ? '<span class="unread-dot"></span>' : ''}
                                <p class="font-bold text-navy text-sm truncate">${escapeHtml(m.name || 'Unknown')}</p>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-0.5 truncate">${escapeHtml(m.contact || '')}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <span class="text-[9px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-bold uppercase">${escapeHtml(m.subject || 'General')}</span>
                            ${date ? `<p class="text-[10px] text-gray-400 mt-1">${date}</p>` : ''}
                        </div>
                    </div>
                    <p class="text-xs text-gray-600 line-clamp-2">${escapeHtml((m.message || '').substring(0, 120))}${(m.message || '').length > 120 ? '...' : ''}</p>
                </div>`;
            });
            list.innerHTML = html;
        }

        window.openDetail = async function(id) {
            const m = allMessages.find(x => x.id === id);
            if (!m) return;
            currentMessageId = id;
            currentMessage = m;

            // Mark as read
            if (!m.read) {
                try {
                    await updateDoc(doc(db, "messages", id), { read: true });
                    m.read = true;
                    const unread = allMessages.filter(x => !x.read).length;
                    document.getElementById('unread-count-text').textContent = unread + ' unread';
                    renderMessages();
                } catch (e) {}
            }

            document.getElementById('dm-name').textContent = m.name || 'Unknown';
            document.getElementById('dm-contact').textContent = m.contact || '';
            document.getElementById('dm-subject').textContent = 'Subject: ' + (m.subject || 'General');
            document.getElementById('dm-message').textContent = m.message || '';
            document.getElementById('dm-date').textContent = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString('en-GB') : '';

            // Contact buttons
            const contact = (m.contact || '').trim();
            const isPhone = /^01[3-9]\d{8}$/.test(contact.replace(/\s+/g, ''));
            const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);

            const callBtn = document.getElementById('dm-call-btn');
            const waBtn = document.getElementById('dm-wa-btn');
            const emailBtn = document.getElementById('dm-email-btn');

            if (isPhone) {
                callBtn.style.display = 'flex';
                callBtn.href = 'tel:' + contact;
                waBtn.style.display = 'flex';
                waBtn.href = 'https://wa.me/88' + contact.replace(/^0/, '') + '?text=' + encodeURIComponent('Hi ' + (m.name || '') + ', thanks for contacting Heartix');
                emailBtn.style.display = 'none';
            } else if (isEmail) {
                callBtn.style.display = 'none';
                waBtn.style.display = 'none';
                emailBtn.style.display = 'flex';
                emailBtn.href = 'mailto:' + contact + '?subject=' + encodeURIComponent('Re: ' + (m.subject || 'Your message'));
            } else {
                callBtn.style.display = 'none';
                waBtn.style.display = 'none';
                emailBtn.style.display = 'none';
            }

            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeDetail = function() {
            document.getElementById('detail-modal').classList.add('hidden');
            currentMessageId = null;
            currentMessage = null;
        };

        window.deleteCurrentMessage = async function() {
            if (!currentMessageId) return;
            if (!confirm('এই message ডিলিট করবেন?')) return;
            try {
                await deleteDoc(doc(db, "messages", currentMessageId));
                toast('Message deleted', 'warn');
                closeDetail();
                await loadMessages();
            } catch (e) {
                toast('ডিলিট করা যায়নি', 'error');
            }
        };
    </script>
</body>
</html>
