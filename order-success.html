<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Success - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/order-success.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl premium-shadow p-6 md:p-8 text-center">

            <div class="w-24 h-24 gold-gradient rounded-full mx-auto flex items-center justify-center mb-5 pop">
                <i class="fas fa-check text-navy text-5xl"></i>
            </div>

            <h1 class="font-display text-3xl navy-text font-bold mb-2 fade-up delay-1">অর্ডার সফল!</h1>
            <p class="text-gray-500 text-sm mb-6 fade-up delay-1">
                আপনার অর্ডারটি আমরা পেয়েছি। শীঘ্রই কল করে কনফার্ম করব।
            </p>

            <div class="bg-cream rounded-2xl p-5 mb-5 fade-up delay-2">
                <p class="text-xs text-gray-500 mb-1">আপনার অর্ডার নাম্বার</p>
                <p id="order-number" class="font-display text-2xl font-bold navy-text tracking-wider">HX00000000</p>
                <button onclick="copyOrderNumber(event)" class="mt-2 text-xs gold-text font-semibold">
                    <i class="fas fa-copy mr-1"></i> কপি করুন
                </button>
            </div>

            <div class="bg-blue-50 rounded-xl p-4 mb-5 text-left fade-up delay-3">
                <p class="text-xs navy-text font-semibold mb-2 flex items-center gap-1.5">
                    <i class="fas fa-info-circle text-blue-500"></i> পরবর্তী ধাপ
                </p>
                <ul class="text-xs text-gray-600 space-y-1.5">
                    <li><i class="fas fa-check-circle text-green-500 mr-1"></i> অর্ডার কনফার্ম করতে আমরা কল দেব</li>
                    <li><i class="fas fa-check-circle text-green-500 mr-1"></i> অগ্রিম দিলে TrxID পাঠাবেন</li>
                    <li><i class="fas fa-check-circle text-green-500 mr-1"></i> কনফার্ম হলে ২-৩ দিনে ডেলিভারি</li>
                </ul>
            </div>

            <!-- WHATSAPP CONFIRM BUTTON -->
            <a id="wa-confirm-btn" href="#" target="_blank" rel="noopener" style="display:none;">
                <div class="w-full bg-[#25D366] active:bg-[#1DA851] text-white font-bold py-4 rounded-2xl text-sm shadow-lg shadow-[#25D366]/30 flex items-center justify-center gap-2.5 transition-colors mb-3 fade-up delay-3">
                    <i class="fab fa-whatsapp text-xl"></i>
                    <span>Confirm on WhatsApp</span>
                </div>
            </a>

            <div class="grid grid-cols-2 gap-3 mb-3 fade-up delay-4">
                <a id="track-btn" href="track-order.html" class="bg-white border-2 border-[#0A1628] text-navy font-semibold py-3 rounded-xl text-sm text-center">
                    <i class="fas fa-truck mr-1"></i> Track Order
                </a>
                <a href="index.html" class="navy-gradient text-white font-semibold py-3 rounded-xl text-sm text-center">
                    <i class="fas fa-home mr-1"></i> Home
                </a>
            </div>

            <p class="text-[10px] text-gray-400 mt-3">
                <i class="fas fa-shield-alt text-gray-300 mr-1"></i> এই নাম্বার সংরক্ষণ করুন
            </p>

        </div>
    </div>

    <script type="module" src="js/order-success.js"></script>
</body>
</html>
