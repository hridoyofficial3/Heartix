<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wishlist - Heartix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { navy: { DEFAULT: '#0A1628' }, gold: { DEFAULT: '#D4A84B' }, cream: '#FBF8F3' },
            fontFamily: { 'display': ['Playfair Display', 'serif'] }
        }}}
    </script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/wishlist.css">
</head>
<body class="pb-16">

    <div id="toast-container"></div>

    <!-- HEADER -->
    <header class="glass sticky top-0 z-30 px-3 py-2 flex justify-between items-center border-b border-gray-100">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-cream">
            <i class="fas fa-arrow-left text-navy text-lg"></i>
        </a>
        <h1 class="font-display text-xl navy-text font-bold">My Wishlist</h1>
        <a href="cart.html" class="relative w-10 h-10 flex items-center justify-center">
            <i class="fas fa-shopping-bag text-navy text-lg"></i>
            <span id="cart-count-header" class="absolute -top-1 -right-1 gold-gradient text-navy text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
    </header>

    <!-- MAIN -->
    <div class="p-4 max-w-2xl mx-auto">

        <!-- LOADING SKELETON -->
        <div id="loading-skeleton" class="grid grid-cols-2 gap-3">
            <div class="bg-white rounded-2xl p-2.5 premium-shadow">
                <div class="w-full h-28 shimmer rounded-lg mb-2"></div>
                <div class="h-3.5 w-3/4 shimmer rounded mb-2"></div>
                <div class="h-3.5 w-1/2 shimmer rounded mb-2"></div>
                <div class="h-8 w-full shimmer rounded-lg"></div>
            </div>
            <div class="bg-white rounded-2xl p-2.5 premium-shadow">
                <div class="w-full h-28 shimmer rounded-lg mb-2"></div>
                <div class="h-3.5 w-3/4 shimmer rounded mb-2"></div>
                <div class="h-3.5 w-1/2 shimmer rounded mb-2"></div>
                <div class="h-8 w-full shimmer rounded-lg"></div>
            </div>
        </div>

        <!-- EMPTY -->
        <div id="empty-wishlist" class="hidden text-center py-16">
            <i class="fas fa-heart text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg font-medium">আপনার wishlist খালি!</p>
            <p class="text-gray-400 text-sm mt-1">পছন্দের প্রোডাক্টে হার্ট আইকনে ক্লিক করুন</p>
            <a href="index.html" class="inline-block mt-5 navy-gradient text-white px-8 py-3 rounded-xl font-semibold text-sm">
                <i class="fas fa-shopping-bag mr-2"></i> শপিং শুরু করুন
            </a>
        </div>

        <!-- WISHLIST GRID -->
        <div id="wishlist-list" class="grid grid-cols-2 md:grid-cols-3 gap-3 hidden"></div>

    </div>

    <script type="module" src="js/wishlist.js"></script>
</body>
</html>
